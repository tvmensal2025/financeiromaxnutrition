# Meta do Fundador (08/10/2026): em 7 dias, plano para recrutar as primeiras 10 pessoas na Mimix e no Hub.
id: recrutar-10-pessoas
empresa: BIZ-003
prioridade: 1                 # 1 = maxima; definida pelo Fundador, herdada por todas as etapas
prazo_dias: 7
decisoes: [DEC-024, DEC-025]  # o codigo injeta o texto vigente e grava a versao em cada despacho
orcamento_meta: { buscas: 10, tarefas: 12, horas_modelo: 3 }   # cota de pesquisa conta buscas de TODOS os agentes
entradas_externas:            # entregas aprovadas da v1, importadas com snapshot antes da execucao
  pesquisa_mimix_hub: JOB-HR-a5dabb24ffdbdaa016299f0e5e3def89
  pesquisa_indicacao_equipe: JOB-HR-0ed988ddf445b819ca5833dfa79831e9
  condicoes_participante: JOB-HR-f6d55eff0523a50f07397cffbfbe313d
etapas:
  - id: E1
    responsavel: AGT-05   # Caio
    entrega: calculo
    objetivo: Conta da receita com 10 pessoas (horas/semana x US$0,50 por hora aprovada, paga pela plataforma), tres cenarios, e quanto cada participante recebe (US$5/h, integral).
    entradas: [pesquisa_indicacao_equipe, condicoes_participante]
    depende_de: []
  - id: E2
    responsavel: AGT-17   # Isabela
    entrega: roteiro_treinamento
    objetivo: Como gravar atividades do dia a dia com qualidade e privacidade, para nao ser reprovado.
    entradas: [pesquisa_mimix_hub, condicoes_participante]
    depende_de: []
  - id: E3
    responsavel: AGT-17   # Isabela
    entrega: copy
    objetivo: Convite para as primeiras 10 pessoas (WhatsApp e redes), sem promessa de renda.
    entradas: [E1, condicoes_participante]
    depende_de: [E1]
  - id: E4
    responsavel: AGT-06   # Clara (barreira juridica unica; nao revisou E2/E3)
    entrega: parecer
    objetivo: O convite (E3) e o roteiro (E2) podem ser usados? Riscos de imagem, voz, terceiros e LGPD, com ajustes por entrega.
    entradas: [E2, E3, condicoes_participante]
    depende_de: [E2, E3]
    se_semaforo:
      AJUSTE: { refazer: [E2, E3], com_entrada: E4, reconferir_por: AGT-06, max_ciclos: 1 }
      NAO_PODE: { aguardar_fundador: true }
  - id: E5
    responsavel: AGT-01   # Helena
    entrega: relatorio_final
    objetivo: Plano dos 7 dias para o Fundador, com passo a passo de cadastro e convite e o checklist do que so ele faz.
    entradas: [E1, E2, E3, E4]
    depende_de: [E1, E2, E3, E4]
acoes_do_fundador:   # o motor nunca executa; aparecem no relatorio como checklist e mantem o card em AGUARDANDO_ACOES_FUNDADOR
  - Cadastrar a empresa na Mimix e no Hub e configurar a divisao/indicacao.
  - Enviar os convites aprovados.
  - Acompanhar as primeiras horas aprovadas.
