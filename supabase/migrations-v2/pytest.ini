# O que é: a configuração do pytest do banco da v2 (roda de dentro de supabase/migrations-v2).
# De onde vem: escrita à mão. Os testes ficam em testes/; não guarda cache dentro do repositório.
# Como mudar: -q deixa a saída curta; tire para ver cada teste.
[pytest]
testpaths = testes
addopts = -p no:cacheprovider -q
