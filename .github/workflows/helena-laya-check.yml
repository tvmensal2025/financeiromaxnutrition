name: Helena Laya Check

on:
  push:
    paths:
      - 'services/laya-service/**'
      - '.github/workflows/helena-laya-check.yml'
  pull_request:
    paths:
      - 'services/laya-service/**'
      - '.github/workflows/helena-laya-check.yml'

jobs:
  check-and-build:
    name: Python Lint, Pytest & Container Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'services/laya-service/requirements.txt'

      - name: Install Dependencies
        working-directory: services/laya-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        working-directory: services/laya-service
        run: python -m pytest -v

      - name: Docker Build Test
        working-directory: services/laya-service
        run: docker build -t laya-service:ci .
