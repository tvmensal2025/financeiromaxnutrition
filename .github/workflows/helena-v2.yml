name: Helena v2

# Confere a v2 inteira a cada envio: a especificação (helena-v2), as 4 peças do motor e o app.
# Nada aqui toca no Supabase, no EasyPanel ou no Hermes: só arquivos, testes e build.

on:
  push:
  pull_request:

concurrency:
  group: helena-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  especificacao:
    name: Especificação (helena-v2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: helena-v2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: helena-v2/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Validar a especificação
        run: python validar.py

      - name: Testes do validador e da máquina de regras
        run: python -m pytest -q

  motor:
    name: Motor (${{ matrix.peca }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        peca: [ferramentas, validador, executor, simulador]
    defaults:
      run:
        working-directory: motor/${{ matrix.peca }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: motor/${{ matrix.peca }}/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Testes
        run: python -m pytest -q

  app:
    name: App (testes e build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testes do app
        run: npm test

      - name: Build de produção
        run: npm run build
