# Opera a VPS da Helena v2 a partir do GitHub (a sessão de nuvem da Claude não alcança a VPS; os runners do GitHub alcançam).
# Disparo manual. Leva o código deste checkout para a VPS por SCP (sem token do GitHub na VPS) e roda
# motor/hermes-vps/instalar-motor.sh com a etapa escolhida. O login do ChatGPT (etapa login) mostra o link e o código
# no registro desta execução: o fundador abre o link, entra e digita o código enquanto a etapa espera (até 15 min).
#
# Segredos do repositório (Settings → Secrets and variables → Actions):
#   VPS_HOST            IP ou nome da VPS
#   VPS_SSH_KEY         chave privada SSH do root (recomendado)  OU  VPS_PASSWORD  senha do root (sshpass)
#   HELENA_SENHA_MOTOR  senha da conta helena_motor (a mesma definida no SQL Editor do Supabase)
#   HELENA_SENHA_DBOS   senha da conta dbos_motor
# Variável opcional: HELENA_DB_HOST (padrão aws-0-us-east-1.pooler.supabase.com). Nada disso aparece no registro.
name: Helena VPS (motor)

on:
  workflow_dispatch:
    inputs:
      etapa:
        description: "Etapa de instalar-motor.sh"
        required: true
        default: tudo
        type: choice
        options: [tudo, preparar, codigo, motor-venv, hermes-venv, login, banco, testar-banco, conferir, validar-config, servicos, ligar-motor, estado]

concurrency:
  group: helena-vps
  cancel-in-progress: false

jobs:
  vps:
    name: "VPS: ${{ inputs.etapa }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Opcional: UM segredo só, HELENA_OFICIAL, com uma linha por valor (NOME=VALOR ou NOME: VALOR). Os segredos
      # separados, quando existem, têm prioridade. Só nomes conhecidos entram; cada valor é mascarado no registro.
      - name: Ler o segredo único HELENA_OFICIAL (se existir)
        env:
          HELENA_OFICIAL: ${{ secrets.HELENA_OFICIAL }}
          S_VPS_HOST: ${{ secrets.VPS_HOST }}
          S_VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          S_HELENA_SENHA_MOTOR: ${{ secrets.HELENA_SENHA_MOTOR }}
          S_HELENA_SENHA_DBOS: ${{ secrets.HELENA_SENHA_DBOS }}
          S_HELENA_DB_HOST: ${{ vars.HELENA_DB_HOST }}
        run: |
          set -euo pipefail
          declare -A v=()
          while IFS= read -r linha || [ -n "$linha" ]; do
            linha="${linha%$'\r'}"
            [ -z "${linha// }" ] && continue
            if [[ "$linha" =~ ^[[:space:]]*([A-Za-z_][A-Za-z0-9_]*)[[:space:]]*[:=][[:space:]]*(.*)$ ]]; then
              nome="${BASH_REMATCH[1]^^}"; valor="${BASH_REMATCH[2]}"
              valor="${valor%"${valor##*[![:space:]]}"}"
              case "$nome" in VPS_HOST|VPS_PASSWORD|HELENA_SENHA_MOTOR|HELENA_SENHA_DBOS|HELENA_DB_HOST) v[$nome]="$valor" ;; *) echo "linha ignorada: nome desconhecido '$nome'" ;; esac
            else
              echo "linha ignorada: sem NOME=VALOR"
            fi
          done <<< "$HELENA_OFICIAL"
          for nome in VPS_HOST VPS_PASSWORD HELENA_SENHA_MOTOR HELENA_SENHA_DBOS HELENA_DB_HOST; do
            separado="S_$nome"; valor="${!separado:-}"
            [ -n "$valor" ] || valor="${v[$nome]:-}"
            if [ -n "$valor" ]; then
              [ "$nome" = VPS_HOST ] || [ "$nome" = HELENA_DB_HOST ] || echo "::add-mask::$valor"
              printf '%s<<__FIM__\n%s\n__FIM__\n' "$nome" "$valor" >> "$GITHUB_ENV"
              echo "$nome: definido"
            else
              echo "$nome: vazio"
            fi
          done

      - name: Preparar acesso SSH (chave ou senha)
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          [ -n "${VPS_HOST:-}" ] || { echo "::error::VPS_HOST ausente (segredo VPS_HOST ou linha VPS_HOST=... em HELENA_OFICIAL)"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || { echo "::error::a VPS nao respondeu na porta 22"; exit 1; }
          if [ -n "$VPS_SSH_KEY" ]; then
            # A chave costuma chegar com quebras de linha perdidas ou trocadas (copiada de um terminal no navegador).
            # Remonta: so o miolo entre BEGIN e END, sem espacos, em linhas de 70, e confere com ssh-keygen antes de usar.
            bruto="$(printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r')"
            miolo="$(printf '%s\n' "$bruto" | sed -n '/BEGIN OPENSSH PRIVATE KEY/,/END OPENSSH PRIVATE KEY/p' | { grep -v -- '-----' || true; } | tr -d ' \t\n')"
            if [ -z "$miolo" ]; then   # tudo numa linha so: os marcadores e o miolo juntos
              miolo="$(printf '%s' "$bruto" | tr -d ' \t\n' | sed -e 's/.*-----BEGINOPENSSHPRIVATEKEY-----//' -e 's/-----ENDOPENSSHPRIVATEKEY-----.*//' || true)"
              printf '%s' "$bruto" | tr -d ' \t\n' | grep -q -- '-----BEGINOPENSSHPRIVATEKEY-----' || miolo=""
            fi
            if [ -z "$miolo" ]; then   # so o miolo, sem BEGIN/END: o corpo de toda chave OpenSSH comeca com "openssh-key-v1" em base64
              candidato="$(printf '%s' "$bruto" | tr -d ' \t\n')"
              case "$candidato" in b3BlbnNzaC1rZXktdjE*) miolo="$candidato" ;; esac
            fi
            case "$(printf '%s' "$bruto" | tr -d ' \t\n')" in ssh-ed25519*|ssh-rsa*|ecdsa-*) echo "::error::VPS_SSH_KEY recebeu a chave PUBLICA (.pub); cole a PRIVADA (cat /root/.ssh/github-actions)"; exit 1 ;; esac
            [ -n "$miolo" ] || { echo "::error::VPS_SSH_KEY nao contem uma chave OpenSSH (BEGIN/END ou corpo b3Blbn...)"; exit 1; }
            { echo '-----BEGIN OPENSSH PRIVATE KEY-----'; printf '%s\n' "$miolo" | fold -w 70; echo '-----END OPENSSH PRIVATE KEY-----'; } > ~/.ssh/vps
            chmod 600 ~/.ssh/vps
            ssh-keygen -y -f ~/.ssh/vps >/dev/null 2>&1 || { echo "::error::VPS_SSH_KEY invalida mesmo depois de remontar: copie de novo do BEGIN ao END"; exit 1; }
            echo "chave SSH valida: $(ssh-keygen -lf ~/.ssh/vps)"   # impressao digital (nao e segredo): compare com ssh-keygen -lf na VPS
            echo "SSH_CMD=ssh -i $HOME/.ssh/vps -o BatchMode=yes" >> "$GITHUB_ENV"
            echo "SCP_CMD=scp -i $HOME/.ssh/vps -o BatchMode=yes" >> "$GITHUB_ENV"
          elif [ -n "${VPS_PASSWORD:-}" ]; then
            sudo apt-get install -y -qq sshpass >/dev/null
            echo "SSH_CMD=sshpass -e ssh -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"
            echo "SCP_CMD=sshpass -e scp -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"
            printf 'SSHPASS<<__FIM__\n%s\n__FIM__\n' "$VPS_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::error::defina VPS_SSH_KEY (recomendado) ou VPS_PASSWORD"; exit 1
          fi

      - name: Enviar o código e o instalador para a VPS
        run: |
          set -euo pipefail
          git bundle create /tmp/helena.bundle HEAD >/dev/null
          $SCP_CMD -q /tmp/helena.bundle motor/hermes-vps/instalar-motor.sh "root@$VPS_HOST:/root/"
          $SSH_CMD "root@$VPS_HOST" 'set -e; rm -rf /root/helena-src; git clone -q /root/helena.bundle /root/helena-src; chmod 700 /root/instalar-motor.sh; echo "codigo na VPS: $(git -C /root/helena-src rev-parse --short HEAD)"'

      - name: "Rodar: ${{ inputs.etapa }}"
        env:
          ETAPA: ${{ inputs.etapa }}
        run: |
          set -euo pipefail
          # Segredos vao num arquivo 0600 pela entrada do SSH (nunca na linha de comando) e sao apagados antes de rodar.
          {
            printf 'export HELENA_REPO_URL=%q HELENA_REF=%q HELENA_REPO_TOKEN=local\n' /root/helena-src HEAD
            [ -n "${HELENA_SENHA_MOTOR:-}" ] && printf 'export HELENA_SENHA_MOTOR=%q\n' "$HELENA_SENHA_MOTOR"
            [ -n "${HELENA_SENHA_DBOS:-}" ]  && printf 'export HELENA_SENHA_DBOS=%q\n'  "$HELENA_SENHA_DBOS"
            [ -n "${HELENA_DB_HOST:-}" ]     && printf 'export HELENA_DB_HOST=%q\n'     "$HELENA_DB_HOST"
            true
          } > /tmp/ambiente.sh
          $SSH_CMD "root@$VPS_HOST" 'umask 077; cat > /root/.helena-ambiente.sh' < /tmp/ambiente.sh
          rm -f /tmp/ambiente.sh
          # -tt: terminal remoto para a etapa login (o Hermes le o codigo do /dev/tty e mostra o link aqui no registro).
          $SSH_CMD -tt "root@$VPS_HOST" 'set -a; . /root/.helena-ambiente.sh; set +a; rm -f /root/.helena-ambiente.sh; bash /root/instalar-motor.sh '"$ETAPA"'; echo "SAIDA=$?"; exit' | sed -E 's#(postgresql://[^:]+:)[^@]+@#\1<senha>@#g'

      - name: Estado final dos serviços
        if: always() && env.SSH_CMD != ''
        run: $SSH_CMD "root@$VPS_HOST" 'bash /root/instalar-motor.sh estado' || true
