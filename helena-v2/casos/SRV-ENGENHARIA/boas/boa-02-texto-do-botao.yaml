# Caso BOM do SRV-ENGENHARIA (Theo, AGT-09) para o pedido ../pedido.yaml, variante TEXTO-DO-BOTAO. SINTÉTICO.
# De onde vem: escrito à mão a partir do pedido; a 'resposta' é a saída do Theo no formato de
# schemas/acao.schema.json ($defs/saida_do_autor). O diff foi gerado com difflib e conferido com
# 'git apply --check'. Passa nas checagens comuns e nas CHK-ENGENHARIA-* e na rubrica (RUB-ENGENHARIA-01 a 08).
# Como mudar: se mudar o diff, mantenha os caminhos da tabela arquivos, o trecho da base igual a um
# trecho da fonte do pedido e os comandos da tabela testes iguais aos do texto do PR; rode o validar.py.
id: ENGENHARIA-BOA-02
servico: SRV-ENGENHARIA
pedido: ../pedido.yaml
variante: TEXTO-DO-BOTAO
nota: 'Mudança só de texto: dois arquivos existentes (código e teste) alterados; o teste ajustado falha antes e passa depois.'
