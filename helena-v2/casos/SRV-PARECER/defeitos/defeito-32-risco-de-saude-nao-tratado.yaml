# Caso RUIM do SRV-PARECER (Clara, AGT-06) para o pedido ../pedido.yaml.
# Igual à boa-02-ok-versao-2 (menos onde o defeito mexe), com UM defeito plantado. 'deve_falhar_em' diz o ID que tem de pegá-lo:
# CHK-... = portão 1 (código; RECUSA volta ao autor, MARCA vai para a faixa do card); RUB-... = portão 2 (revisora, REPROVAR).
# Serve ao teste 5 (validador) e ao teste 9 do par revisor x parecer (Helena).
id: PARECER-RUIM-32
servico: SRV-PARECER
pedido: ../pedido.yaml
derivado_de: ../boas/boa-02-ok-versao-2.yaml
defeito_plantado: Julga o convite 'Baixe e comece hoje.' e deixa sem linha a frase 'o Doutor Vital traduz seus exames em
  linguagem simples' (risco de orientação de saúde).
deve_falhar_em: RUB-PARECER-02
portao: 2 (revisor)
motivo_esperado: o risco de promessa de saúde da legenda não aparece em nenhuma linha.
usou_internet: SIM
leituras_feitas:
- fitas/01-politica-parte-1.yaml
- fitas/02-politica-parte-2.yaml
resposta:
  acao: ENTREGAR
  parecer: OK
  acao_externa:
    tipo: NENHUMA
  entrega:
    pecas:
    - etapa: E1
      versao: 2
      semaforo: OK
      por_que: A frase sobre onde os dados ficam saiu e a legenda remete à política, que diz a verdade (item 6). O aviso
        para maiores de 18 anos bate com a política (item 2). A legenda não promete diagnóstico, cura nem resultado.
      trecho_da_peca: nenhum
      ajuste: nenhum
      fundamentos: F1, F2, F3
    temas:
    - tema: TEMA-IMAGEM
      aplica: NAO
      natureza: NAO_SE_APLICA
      resposta: 'A legenda é só texto: não usa foto, vídeo nem rosto de pessoa.'
      trecho_da_peca: nenhum
      fundamentos: nenhum
    - tema: TEMA-VOZ
      aplica: NAO
      natureza: NAO_SE_APLICA
      resposta: 'A legenda é só texto: não usa gravação, áudio nem voz de ninguém.'
      trecho_da_peca: nenhum
      fundamentos: nenhum
    - tema: TEMA-DADO-SENSIVEL
      aplica: SIM
      natureza: OBRIGACAO_CONFIRMADA
      resposta: A legenda diz que a pessoa escolhe o que registrar. Dado de saúde é sensível pela tabela e pede consentimento
        específico; a política diz que o app pede esse consentimento antes do primeiro registro (item 5).
      trecho_da_peca: Você escolhe o que registrar
      fundamentos: F4, F5, F6
    - tema: TEMA-TRANSFERENCIA-INTERNACIONAL
      aplica: SIM
      natureza: PONTO_INCERTO
      resposta: 'A legenda só remete à política, que diz que os dados podem ficar fora do Brasil (item 6). Remeter é verdadeiro.
        Se essa transferência é permitida eu não sei dizer: a tabela traz só o começo do art. 33, sem a lista de casos.'
      trecho_da_peca: a política de privacidade explica onde seus dados ficam
      fundamentos: F7, F3
    - tema: TEMA-MENORES
      aplica: SIM
      natureza: INTERPRETACAO
      resposta: 'A legenda agora diz que o app é para maiores de 18 anos, como a política (item 2). Leitura minha: o aviso
        basta para a legenda; ele não impede que um menor baixe o app.'
      trecho_da_peca: Para maiores de 18 anos.
      fundamentos: F8
    - tema: TEMA-VINCULO-DE-TRABALHO
      aplica: NAO
      natureza: NAO_SE_APLICA
      resposta: A legenda não fala de tarefa, de pagamento a pessoas nem de trabalho.
      trecho_da_peca: nenhum
      fundamentos: nenhum
    - tema: TEMA-PUBLICIDADE
      aplica: SIM
      natureza: INTERPRETACAO
      resposta: 'O texto é um convite simples a baixar o app, sem promessa de resultado. Leitura minha: sem promessa enganosa.'
      trecho_da_peca: Baixe e comece hoje.
      fundamentos: F1
    - tema: TEMA-PASSOS-FIXOS
      aplica: NAO
      natureza: NAO_SE_APLICA
      resposta: O plano deste card não tem passo fixo do roteiro.
      trecho_da_peca: nenhum
      fundamentos: nenhum
    condicoes:
    - condicao: Publicar com a política igual ao rascunho de 01/10/2026 lido aqui; se ela mudar o que diz sobre onde os
        dados ficam ou sobre diagnóstico, este parecer precisa ser refeito.
      antes_de: AF-COPY-ENVIAR-OU-PUBLICAR
      fundamentos: F3, F9
    quando_chamar_advogado:
    - gatilho: Antes de decidir manter servidores fora do Brasil para dados de saúde, ou se a política passar a dizer o
        país.
      cobre: TEMA-TRANSFERENCIA-INTERNACIONAL
    nao_coberto:
    - 'A política de privacidade em si: este parecer julga a legenda, não o documento (FORA-CONTRATOS-E-PRIVACIDADE).'
    - As imagens e as telas do post, que não vieram para este parecer.
    fundamentos:
    - id: F1
      origem: TABELA_DE_LEIS
      referencia: CDC, art. 37, § 1º
      citacao:
        trecho_original: É enganosa qualquer modalidade de informação ou comunicação de caráter publicitário, inteira ou
          parcialmente falsa
        fonte_importada_id: FON-LEIS-TESTE-v0
      nota: nenhuma
    - id: F2
      origem: TERMOS_LIDOS
      referencia: Política de privacidade, item 2 (Quem pode usar)
      citacao:
        trecho_original: O uso do aplicativo é destinado somente a pessoas com 18 anos ou mais. Se você tem menos de 18
          anos, não crie uma conta.
        leitura_id: LEI-PAR-0001
        parte: 1
      nota: nenhuma
    - id: F3
      origem: TERMOS_LIDOS
      referencia: Política de privacidade, item 6 (Onde os dados ficam)
      citacao:
        trecho_original: Os dados pessoais, inclusive os dados de saúde que você registrar no aplicativo, podem ser armazenados
          e processados em servidores localizados fora do Brasil, contratados pela eLiving™.
        leitura_id: LEI-PAR-0001
        parte: 2
      nota: nenhuma
    - id: F4
      origem: TABELA_DE_LEIS
      referencia: LGPD, art. 5º, II
      citacao:
        trecho_original: dado referente à saúde ou à vida sexual, dado genético ou biométrico, quando vinculado a uma pessoa
          natural;
        fonte_importada_id: FON-LEIS-TESTE-v0
      nota: nenhuma
    - id: F5
      origem: TABELA_DE_LEIS
      referencia: LGPD, art. 11, I
      citacao:
        trecho_original: quando o titular ou seu responsável legal consentir, de forma específica e destacada, para finalidades
          específicas;
        fonte_importada_id: FON-LEIS-TESTE-v0
      nota: nenhuma
    - id: F6
      origem: TERMOS_LIDOS
      referencia: Política de privacidade, item 5 (Consentimento)
      citacao:
        trecho_original: Antes de você registrar um dado de saúde pela primeira vez, o aplicativo pede o seu consentimento
          específico para isso, em uma tela própria.
        leitura_id: LEI-PAR-0001
        parte: 2
      nota: nenhuma
    - id: F7
      origem: TABELA_DE_LEIS
      referencia: LGPD, art. 33, caput
      citacao:
        trecho_original: 'A transferência internacional de dados pessoais somente é permitida nos seguintes casos:'
        fonte_importada_id: FON-LEIS-TESTE-v0
      nota: NOTA-TESTE-01
    - id: F8
      origem: TABELA_DE_LEIS
      referencia: LGPD, art. 14, caput
      citacao:
        trecho_original: O tratamento de dados pessoais de crianças e de adolescentes deverá ser realizado em seu melhor
          interesse, nos termos deste artigo e da legislação pertinente.
        fonte_importada_id: FON-LEIS-TESTE-v0
      nota: nenhuma
    - id: F9
      origem: TERMOS_LIDOS
      referencia: Política de privacidade, item 4 (Para que usamos)
      citacao:
        trecho_original: Usamos os seus dados para montar o seu acompanhamento diário e para mostrar os seus indicadores
          em linguagem simples. Os pilares do aplicativo não fazem diagnóstico nem prescrevem tratamento.
        leitura_id: LEI-PAR-0001
        parte: 1
      nota: nenhuma
