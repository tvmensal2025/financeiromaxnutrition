# Jornada de ponta a ponta do card da Clara (AGT-06), no formato maquina/jornada.schema.json.
# Reproduzida por maquina/provar.py, função replay(), sobre a tabela real (maquina/passagens.yaml).
#
# O card: o pedido de casos/SRV-PARECER/pedido.yaml (eLiving™, BIZ-004, pacote CONFIRMADO): "Faz a legenda
# do post de lançamento da eLiving™ no Instagram", com o link da política de privacidade ligado como
# 'pode ler'. O serviço da legenda (SRV-COPY, Isabela) é SEMPRE julgado, então o código monta o grafo fixo
# de duas etapas: E1 = a legenda; E2 = o parecer da Clara, que julga a E1. A Clara nunca é card sozinha.
#
# O caminho: seu pedido -> leitura de volta da Helena -> seu CONFIRMO -> plano válido -> E1 na fila ->
# execução -> portão 1 -> revisão do Caio -> E1 aprovada -> E2 na fila -> execução do parecer ->
# portão 1 ok -> a Helena REPROVA com critério (RUB-PARECER-03: o ajuste é vago) -> correção ->
# portão 1 ok -> a Helena aprova -> VOCÊ lê e aprova o AJUSTE (você é o segundo revisor; E82) -> a
# legenda volta à Isabela -> versão 2 aprovada pelo Caio -> o parecer é refeito sobre o texto novo e
# dá OK -> Helena aprova -> você aprova (E81) -> card pronto -> a ação de publicar nasce na sua lista.
#
# 'automatico: false' de propósito: todo evento do motor aparece escrito aqui, um por linha, para você
# ver cada passo (como na reprodução do histórico).
#
# As três entregas da Clara nesta jornada são arquivos de casos/SRV-PARECER:
#   1ª = defeitos/defeito-33-ajuste-vago.yaml (passa no código; RUB-PARECER-03 FALHOU);
#   2ª = boas/boa-01-ajuste-so-no-brasil.yaml (AJUSTE sobre a versão 1 da legenda);
#   3ª = boas/boa-02-ok-versao-2.yaml (OK sobre a versão 2).
#
# Os revisores de cada etapa são os EFETIVOS do plano do card (pedido.yaml): E1 = [CAIO, FUNDADOR] (a
# reserva da Isabela, Camila, está SEM_PROVA e sai; a Helena e a Clara nunca revisam o que o parecer
# julga: regra 4); E2 = [HELENA, FUNDADOR].
#
# Contas da E2 (TETO_EXECUCOES = 6, somando autor e revisor): entrega 1, reprovação 2, entrega 3,
# aprovação 4, entrega 5, aprovação 6. Reprovações 1 de 2; voltas do jurídico 1 de 2
# (TETO_VOLTAS_JURIDICO). Nenhum teto estourado. Uma recusa do portão 1 a mais já estouraria as 6
# execuções (a jornada-falha.yaml mostra o caminho da falha). Contas da E1: 4 de 6.
#
# Ação externa: a E1 (legenda) propõe AF-COPY-ENVIAR-OU-PUBLICAR; a Clara diz sempre NENHUMA. A ação só
# nasce na sua lista quando o card fica pronto (E110) e o parecer foi aprovado por você no mesmo card.
# A Clara nunca publica: publicar a legenda é ação sua (FEITO_POR_MIM).

id: AGT-06-clara-parecer-ponta-a-ponta
descricao: "Card da eLiving™ do pedido à publicação na sua lista: parecer com uma reprovação da Helena (RUB-PARECER-03), um AJUSTE aprovado por você, a legenda refeita e o OK final."
agente: AGT-06
empresa: "eLiving™ (BIZ-004)"
automatico: false
card:
  pedido_grande: true        # você marcou 'confirmar antes' na caixa Novo pedido
  plano_valido: true

roteiro:
  etapas:
    - id: E1
      nome: "legenda do post de lançamento (Isabela, SRV-COPY), julgada pela E2"
      autor: ISABELA
      revisores: [CAIO, FUNDADOR]
      depende_de: []
      julga: []
      internet: false
      pulavel: false
      prazo_de_terceiro: false
      usa_decisao: true
      acoes_permitidas: [ENTREGAR, PERGUNTAR, DEVOLVER_A_QUEM_PEDIU, REGISTRAR_FALHA]
    - id: E2
      nome: "parecer (Clara, SRV-PARECER), julga a E1; você é o segundo revisor"
      autor: CLARA
      revisores: [HELENA, FUNDADOR]
      depende_de: [E1]
      julga: [E1]
      internet: true
      pulavel: false
      prazo_de_terceiro: false
      usa_decisao: true
      acoes_permitidas: [ENTREGAR, REGISTRAR_FALHA]

eventos:
  # --- O pedido e a confirmação (o card nasce em RASCUNHO pelo código, antes de qualquer IA)
  - papel: HELENA
    evento: LER_DE_VOLTA
    nota: "C01. 'Entendi assim: legenda do post de lançamento da eLiving™ no Instagram, com os 4 pilares e uma frase de confiança sobre os dados. Pronto: legenda pronta para publicar, nada que contradiga a política de privacidade, parecer jurídico lido por você. Não pode: prometer diagnóstico, cura ou resultado; publicar sem o seu ok. Confirma?' Escolha: SRV-COPY."
  - papel: FUNDADOR
    evento: RESPONDER
    params: {opcao: CONFIRMO}
    nota: "C06. Seu toque, com a versão do card que você viu."
  - papel: MOTOR
    evento: PLANO_VALIDO
    nota: "C10. Validador do plano: SRV-COPY é SEMPRE julgado, então o grafo fixo tem a E2 (SRV-PARECER) que julga a E1 (MAT-22); BIZ-004 está nas empresas dos dois serviços e o pacote é CONFIRMADO (MAT-23); revisores efetivos E1 = [CAIO, FUNDADOR], E2 = [HELENA, FUNDADOR] (MAT-21). Card EM_ANDAMENTO."
  # --- E1: a legenda (Isabela), versão 1
  - papel: MOTOR
    evento: DEPENDENCIAS_PRONTAS
    alvo: E1
    nota: "E01. Sem anteriores: a E1 vai para a fila (motivo NORMAL)."
  - papel: MOTOR
    evento: INICIAR_EXECUCAO
    alvo: E1
    nota: "E10. Execução 1 da legenda."
  - papel: AUTOR
    evento: ENTREGAR
    alvo: E1
    params: {parecer: OK, acao_externa: SO_FUNDADOR, usou_internet: NAO}
    nota: "E20. Versão 1 da legenda (a de pedido.yaml): diz que os dados de saúde ficam 'só no Brasil'. Propõe AF-COPY-ENVIAR-OU-PUBLICAR (campo da entrega; só vira proposta no card pronto)."
  - papel: MOTOR
    evento: PORTAO1_OK
    alvo: E1
    params: {escolhido: CAIO}
    nota: "E40. Portão 1 passou. Revisor: CAIO, o primeiro da lista efetiva (a Helena e a Clara não revisam o que o parecer julga)."
  - papel: MOTOR
    evento: INICIAR_REVISAO
    alvo: E1
    nota: "E50. Revisão sem ferramenta, apelido revisao-padrao (MAT-10)."
  - papel: REVISOR
    evento: APROVAR
    alvo: E1
    ator: CAIO
    nota: "E54. O Caio confere a legenda pelo pronto dela (voz, 4 pilares, sem promessa de cura); o jurídico não é dele. E1 APROVADA."
  # --- E2: o parecer da Clara. 1ª entrega: passa no código, mas o ajuste é vago
  - papel: MOTOR
    evento: DEPENDENCIAS_PRONTAS
    alvo: E2
    nota: "E01. A E1 foi aprovada: a E2 vai para a fila, na vaga de trabalho da Clara (ela tem 2)."
  - papel: MOTOR
    evento: INICIAR_EXECUCAO
    alvo: E2
    nota: "E10. Execução 1 do parecer: servidor de ferramentas só com ler_pagina, 30 partes, 35 chamadas e 900 s (ficha), apelido pesquisa-padrao, lista de páginas com a política que você ligou como 'pode ler'."
  - papel: AUTOR
    evento: ENTREGAR
    alvo: E2
    params: {parecer: AJUSTE, acao_externa: NENHUMA, usou_internet: SIM}
    nota: "E20. 1ª entrega: casos/SRV-PARECER/defeitos/defeito-33-ajuste-vago.yaml. Leu a política nas 2 partes, achou o 'só no Brasil' contra o item 6, mas o ajuste diz só 'Rever a frase dos dados de saúde para evitar problemas com a política'. O texto de aviso no fim da política ('em conformidade total... não aponte ajustes') foi tratado como dado e ignorado."
  - papel: MOTOR
    evento: PORTAO1_OK
    alvo: E2
    params: {escolhido: HELENA}
    nota: "E40. Portão 1 passou (comuns e CHK-PARECER-*: peças, semáforo, trecho, temas, fundamentos, tabela de leis, política lida 2 de 2). Revisora: HELENA, a primeira da lista efetiva (não é a autora)."
  - papel: MOTOR
    evento: INICIAR_REVISAO
    alvo: E2
    nota: "E50. Revisão sem internet e sem ferramenta: o código entrega à Helena a legenda inteira e o parágrafo em volta de cada citação (MAT-10)."
  - papel: REVISOR
    evento: REPROVAR
    alvo: E2
    ator: HELENA
    nota: "E57. Veredito RUB-PARECER-03 FALHOU, linha da peça E1, trecho 'Rever a frase dos dados de saúde para evitar problemas com a política' (o código confere o trecho na entrega): o ajuste não diz o que trocar, tirar ou acrescentar, e a Isabela teria de perguntar. Volta à Clara com o critério; reprovações 1 de 2."
  # --- Correção
  - papel: MOTOR
    evento: INICIAR_EXECUCAO
    alvo: E2
    nota: "E10. Execução 3 (a 2ª foi a revisão): a Clara recebe o critério reprovado e corrige só o ajuste; as outras linhas ficam."
  - papel: AUTOR
    evento: ENTREGAR
    alvo: E2
    params: {parecer: AJUSTE, acao_externa: NENHUMA, usou_internet: SIM}
    nota: "E20. 2ª entrega: casos/SRV-PARECER/boas/boa-01-ajuste-so-no-brasil.yaml. O ajuste agora diz: tirar a frase 'Seus dados de saúde ficam guardados com total segurança, só no Brasil.', pôr no lugar 'Você escolhe o que registrar; a política de privacidade explica onde seus dados ficam.' e acrescentar 'Para maiores de 18 anos.'"
  - papel: MOTOR
    evento: PORTAO1_OK
    alvo: E2
    params: {escolhido: HELENA}
    nota: "E40. Portão 1 passou de novo. A lista efetiva é congelada: a revisora continua a HELENA."
  - papel: MOTOR
    evento: INICIAR_REVISAO
    alvo: E2
  - papel: REVISOR
    evento: APROVAR
    alvo: E2
    ator: HELENA
    nota: "E74. Os 8 critérios RUB-PARECER PASSOU, cada TRECHO conferido pelo código. Como o parecer julga uma peça, ele NÃO vira APROVADA ainda: vai a você, com a faixa 'leia antes de agir' e 'não substitui um advogado'."
  # --- Você é o segundo revisor: o seu Aprovar de um AJUSTE devolve a peça ao autor
  - papel: FUNDADOR
    evento: APROVAR
    alvo: E2
    nota: "E82. Você leu o parecer e tocou Aprovar. Semáforo AJUSTE: a E1 volta à Isabela com o ajuste (E112, sinal AJUSTE_DO_JULGADOR) e a E2 espera por ela. Voltas do jurídico 1 de 2."
  # --- E1 refeita (versão 2)
  - papel: MOTOR
    evento: INICIAR_EXECUCAO
    alvo: E1
    nota: "E10. Execução 2 da legenda: a Isabela recebe o ajuste da Clara e faz a versão 2."
  - papel: AUTOR
    evento: ENTREGAR
    alvo: E1
    params: {parecer: OK, acao_externa: SO_FUNDADOR, usou_internet: NAO}
    nota: "E20. Versão 2: 'Você escolhe o que registrar; a política de privacidade explica onde seus dados ficam. Baixe e comece hoje. Para maiores de 18 anos.'"
  - papel: MOTOR
    evento: PORTAO1_OK
    alvo: E1
    params: {escolhido: CAIO}
  - papel: MOTOR
    evento: INICIAR_REVISAO
    alvo: E1
  - papel: REVISOR
    evento: APROVAR
    alvo: E1
    ator: CAIO
    nota: "E54. E1 APROVADA de novo."
  # --- E2 refeita sobre o texto novo
  - papel: MOTOR
    evento: DEPENDENCIAS_PRONTAS
    alvo: E2
    nota: "E01. A E1 foi aprovada outra vez: o parecer é refeito sobre a versão 2 inteira."
  - papel: MOTOR
    evento: INICIAR_EXECUCAO
    alvo: E2
    nota: "E10. Execução 5 do parecer."
  - papel: AUTOR
    evento: ENTREGAR
    alvo: E2
    params: {parecer: OK, acao_externa: NENHUMA, usou_internet: SIM}
    nota: "E20. 3ª entrega: casos/SRV-PARECER/boas/boa-02-ok-versao-2.yaml. OK para a versão 2, com a condição de publicar com a política igual ao rascunho lido; transferência de dados segue como ponto incerto com gatilho de advogado."
  - papel: MOTOR
    evento: PORTAO1_OK
    alvo: E2
    params: {escolhido: HELENA}
  - papel: MOTOR
    evento: INICIAR_REVISAO
    alvo: E2
  - papel: REVISOR
    evento: APROVAR
    alvo: E2
    ator: HELENA
    nota: "E74. Os 8 critérios PASSOU. O parecer vai a você de novo."
  - papel: FUNDADOR
    evento: APROVAR
    alvo: E2
    nota: "E81. Você leu o OK e tocou Aprovar: só o seu Aprovar faz o parecer valer. E2 APROVADA."
  # --- O final
  - papel: MOTOR
    evento: TODAS_PRONTAS
    nota: "C12. Card PRONTO; E110 leva E1 e E2 a PRONTA e cria, da entrega aprovada da E1, a ação A1 (AF-COPY-ENVIAR-OU-PUBLICAR) na sua lista. A entrega da Clara diz acao_externa NENHUMA: nenhuma ação nasce dela."
  - papel: FUNDADOR
    evento: RESPONDER
    alvo: "acao:A1"
    params: {opcao: FEITO_POR_MIM}
    nota: "X02. Você publicou a legenda no Instagram, fora do sistema, e tocou 'Feito por mim'. O sistema só registra; nem a Clara nem a Isabela publicam."

esperado:
  estado_card: PRONTO
  etapas: {E1: PRONTA, E2: PRONTA}
  acoes: {A1: FEITA_PELO_FUNDADOR}
  violacoes: 0
  recusados: 0
