  texto: >-
    Política de privacidade da eLiving™ — rascunho de 01/10/2026.
    1. Quem somos. A eLiving™ é uma inteligência pessoal de evolução. Esta política explica como
    tratamos os seus dados pessoais no aplicativo.
    2. Quem pode usar. O uso do aplicativo é destinado somente a pessoas com 18 anos ou mais. Se você
    tem menos de 18 anos, não crie uma conta.
    3. Que dados coletamos. Coletamos os dados que você informa no cadastro e os dados de saúde que você
    decidir registrar, como peso, sono, exames e medicamentos. Você escolhe o que registrar e pode apagar
    cada registro quando quiser.
    4. Para que usamos. Usamos os seus dados para montar o seu acompanhamento diário e para mostrar os
    seus indicadores em linguagem simples. Os pilares do aplicativo não fazem diagnóstico nem prescrevem
    tratamento.
