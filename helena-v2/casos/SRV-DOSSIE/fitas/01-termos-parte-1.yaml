  texto: >-
    Termos do Programa de Participantes da Mimix — versão de teste de 01/10/2026.
    1. Quem pode participar. O programa é aberto a pessoas com 18 anos ou mais, e cada pessoa pode manter somente uma conta de participante.
    2. Tarefas. O participante escolhe as tarefas de gravação disponíveis no aplicativo, e cada tarefa só conta depois de aprovada pela equipe de revisão da Mimix.
    3. Pagamento. A Mimix paga cada tarefa aprovada em dólares americanos, de acordo com a tabela de valores publicada no aplicativo no dia da aprovação.
    4. Prazo e forma de pagamento. O pagamento é feito até 30 dias depois da aprovação da tarefa, por transferência para a conta cadastrada pelo participante, e as tarifas do banco ficam por conta dele.
