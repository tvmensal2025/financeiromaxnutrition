    5. Indicação. Cada participante recebe um código de indicação pessoal, que pode compartilhar com pessoas que ainda não têm conta na Mimix.
    6. Bônus de indicação. A Mimix paga um bônus ao participante que indicou quando a pessoa indicada tem a primeira tarefa aprovada dentro de 60 dias depois do cadastro.
