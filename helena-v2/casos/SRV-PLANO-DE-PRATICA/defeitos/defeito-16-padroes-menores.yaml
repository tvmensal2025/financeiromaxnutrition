# Caso RUIM do SRV-PLANO-DE-PRATICA (Laura, AGT-02) para o pedido ../pedido.yaml.
# Igual à boa-01, com UM defeito plantado. 'deve_falhar_em' diz o ID que tem de pegá-lo:
# CHK-... = portão 1 (código, PORTAO1_RECUSOU); RUB-... = portão 2 (revisora, REPROVAR).
id: PRATICA-RUIM-16
servico: SRV-PLANO-DE-PRATICA
pedido: ../pedido.yaml
derivado_de: ../boas/boa-01.yaml
defeito_plantado: Escolhe dois detalhes menores ('a gente' e 'inteligência artificial' por extenso) e deixa de fora
  o rodeio do começo.
deve_falhar_em: RUB-PRATICA-02
portao: 2 (revisora)
passa_no_codigo: true
veredito_esperado_do_revisor:
  criterio: RUB-PRATICA-02
  veredito: FALHOU
  secao: padroes
resposta:
  acao: ENTREGAR
  parecer: OK
  acao_externa:
    tipo: NENHUMA
  entrega:
    objetivo: Explicar o seu projeto em 1 minuto, indo direto ao ponto.
    padroes:
    - id: P1
      comportamento: Você diz 'a gente' em vez de 'nós'.
      trecho:
        trecho_original: E a gente também está olhando outras plataformas além da primeira, então isso pode crescer
          bastante com o tempo, né.
        fonte_importada_id: FON-PEDIDO-PRATICA-01
      efeito: '''A gente'' soa menos formal.'
    - id: P2
      comportamento: Você diz 'inteligência artificial' por extenso.
      trecho:
        trecho_original: E, ao mesmo tempo, as empresas que fazem inteligência artificial precisam de gravações
          e de textos de pessoas de verdade, tipo conversas do dia a dia, coisas bem simples.
        fonte_importada_id: FON-PEDIDO-PRATICA-01
      efeito: A expressão longa ocupa espaço na frase.
    exercicio:
    - padrao: P1
      passos: 1) Releia a transcrição e troque cada 'a gente' por 'nós'. 2) Leia a fala em voz alta uma vez.
      duracao:
        valor: 5
        unidade: minutos
        origem: PREMISSA
      criterio: A releitura não tem nenhum 'a gente'.
    registro:
    - padrao: P1
      medida: Quantas vezes você diz 'a gente'
      marcador: a gente
      hoje:
        valor: 1
        unidade: vezes
        origem: CALCULADO
        ref: contagem nas suas falas (EU:) do pedido original
      meta:
        valor: 0
        unidade: vezes
        origem: PREMISSA
    proxima_pratica: Faça o exercício amanhã. Depois, grave a apresentação inteira uma vez, transcreva e traga num
      pedido novo de prática, com as suas falas marcadas 'EU:'. O código conta de novo palavras, 'né' e 'tipo' para
      comparar com hoje.
    limites:
    - A transcrição não mostra ritmo, pausas nem tom de voz.
    - 'É uma tentativa só, para um ouvinte só: o padrão pode mudar com outro público.'
