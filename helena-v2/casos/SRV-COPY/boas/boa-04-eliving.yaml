# Caso BOM do SRV-COPY (Isabela, AGT-17) para o pedido ../pedido.yaml, variante ELIVING (empresa BIZ-004). SINTÉTICO.
# De onde vem: escrito à mão a partir do pedido; a 'resposta' é a saída da Isabela no formato de
# schemas/acao.schema.json ($defs/saida_do_autor). Passa em todas as checagens (comuns e CHK-COPY-01 a 10)
# e na rubrica (RUB-COPY-01 a 08). É o caso que EXERCITA a CHK-COPY-05, que só vale para a eLiving™ (BIZ-004).
# Como mudar: se mudar o texto, mantenha cada frase de 'afirmacoes' igual a um trecho do texto e cada 'apoio' igual
# a um trecho do pedido ou do pacote; depois rode o validar.py.
id: COPY-BOA-04
servico: SRV-COPY
pedido: ../pedido.yaml
variante: ELIVING
nota: 'Convite da eLiving™ (variante ELIVING, empresa BIZ-004): prova a CHK-COPY-05 (sem caloria, dieta nem app fitness);
  o slogan oficial do pacote entra igual, os quatro pilares aparecem como personagens do produto.'
