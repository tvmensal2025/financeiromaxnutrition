# Caso BOM do SRV-CALCULO (Caio, AGT-05) para o pedido ../pedido.yaml (variante SO-DOLAR).
# A 'resposta' é a saída do Caio no formato de schemas/acao.schema.json ($defs/saida_do_autor).
# Sem pedido em reais não há câmbio: o resultado fica na moeda dos números (regra 4 da ficha).
id: CALC-BOA-02
servico: SRV-CALCULO
pedido: ../pedido.yaml
variante: SO-DOLAR
nota: 'Mesmo modelo sem a cotação: três contas e o resultado principal só em dólar.'
deve_passar_em:
- CHK-CALCULO-01
- CHK-CALCULO-02
- CHK-CALCULO-03
- CHK-CALCULO-04
- CHK-CALCULO-05
- CHK-CALCULO-06
- CHK-CALCULO-07
- CHK-CALCULO-08
- CHK-CALCULO-09
- CHK-CALCULO-10
- CHK-CALCULO-11
- CHK-CALCULO-12
- RUB-CALCULO-01
- RUB-CALCULO-02
- RUB-CALCULO-03
- RUB-CALCULO-04
- RUB-CALCULO-05
- RUB-CALCULO-06
- RUB-CALCULO-07
- RUB-CALCULO-08
veredito_esperado_do_revisor: APROVAR
resposta:
  acao: ENTREGAR
  parecer: OK
  acao_externa:
    tipo: NENHUMA
  entrega:
    pergunta: Quanto a Humano Digital recebe da plataforma por mês com 10 pessoas gravando 5 horas por semana, em
      dólar, em três cenários.
    entradas:
    - id: V1
      o_que: Pessoas gravando, indicadas pela Humano Digital
      valor:
        valor: 10
        unidade: pessoas
        origem: DADO_DO_FUNDADOR
        ref: FON-PEDIDO-CALCULO-02
        citacao:
          trecho_original: Quanto entra por mês para a Humano Digital com 10 pessoas gravando 5 horas por semana
            na Mimix e no Hub?
          fonte_importada_id: FON-PEDIDO-CALCULO-02
    - id: V2
      o_que: Horas gravadas por pessoa por semana
      valor:
        valor: 5
        unidade: horas por semana
        origem: DADO_DO_FUNDADOR
        ref: FON-PEDIDO-CALCULO-02
        citacao:
          trecho_original: Quanto entra por mês para a Humano Digital com 10 pessoas gravando 5 horas por semana
            na Mimix e no Hub?
          fonte_importada_id: FON-PEDIDO-CALCULO-02
    - id: V3
      o_que: Valor que a plataforma paga à empresa por hora aprovada
      valor:
        valor: 0.5
        unidade: US$ por hora aprovada
        origem: DADO_DO_FUNDADOR
        ref: FON-PEDIDO-CALCULO-02
        citacao:
          trecho_original: A plataforma paga à empresa US$ 0,50 por hora aprovada de cada pessoa indicada.
          fonte_importada_id: FON-PEDIDO-CALCULO-02
    - id: V4
      o_que: Parte das horas gravadas que a plataforma aprova
      valor:
        valor: 70
        unidade: '%'
        origem: PREMISSA
    contas:
    - id: K1
      o_que: Horas gravadas pelo grupo por mês
      expressao: V1 × V2 × 52 ÷ 12
      resultado:
        valor: 216.67
        unidade: horas por mês
        origem: CALCULADO
        ref: K1
      natureza: PREVISTO
    - id: K2
      o_que: Horas aprovadas do grupo por mês
      expressao: K1 × V4 ÷ 100
      resultado:
        valor: 151.67
        unidade: horas aprovadas por mês
        origem: CALCULADO
        ref: K2
      natureza: PREVISTO
    - id: K3
      o_que: Valor que a empresa recebe por mês, em dólar
      expressao: K2 × V3
      resultado:
        valor: 75.83
        unidade: US$ por mês
        origem: CALCULADO
        ref: K3
      natureza: PREVISTO
    resultado_principal:
    - conta: K3
      sentido: MAIOR_E_MELHOR
    cenarios:
    - cenario: CONSERVADOR
      conta: K3
      ajustes: V4 = 50
      resultado:
        valor: 54.17
        unidade: US$ por mês
        origem: CALCULADO
        ref: K3/CONSERVADOR
    - cenario: BASE
      conta: K3
      ajustes: —
      resultado:
        valor: 75.83
        unidade: US$ por mês
        origem: CALCULADO
        ref: K3/BASE
    - cenario: OTIMISTA
      conta: K3
      ajustes: V4 = 90
      resultado:
        valor: 97.5
        unidade: US$ por mês
        origem: CALCULADO
        ref: K3/OTIMISTA
    premissas_a_confirmar:
    - entrada: V4
      por_que_este_valor: 'Você disse que nem toda hora gravada é aprovada, sem dizer quanto. Usei 70% no cenário
        base, 50% no conservador e 90% no otimista: é suposição minha, não é dado da plataforma.'
      como_confirmar: Comparar as horas gravadas com as horas aprovadas no painel da plataforma, quando as primeiras
        gravações forem avaliadas.
    leitura: 'Pela estimativa, com 10 pessoas gravando 5 horas por semana, a Humano Digital receberia da plataforma
      de US$ 54,17 a US$ 97,50 por mês, e US$ 75,83 no cenário base. É previsão: depende de quantas horas a plataforma
      aprovar, que é premissa minha para você confirmar.'
    riscos:
    - Se a plataforma aprovar menos de 50% das horas, o valor fica abaixo do cenário conservador. O sinal que avisa
      cedo é a parte aprovada das primeiras horas gravadas.
    - Se as 10 pessoas gravarem menos de 5 horas por semana, o valor cai na mesma proporção. O sinal é o total de
      horas gravadas na primeira semana.
    limites:
    - Imposto sobre este valor e nota fiscal ficam com o contador, fora deste serviço.
    - 'Quando o dinheiro chega à conta da empresa depende do calendário de pagamento da plataforma, que não veio
      no pedido: a conta mostra o valor estimado por mês de gravação, não o caixa.'
    - 'O valor em reais não foi calculado: você pediu só em dólar, e a conversão precisaria da sua cotação ou de
      uma fonte com data.'
