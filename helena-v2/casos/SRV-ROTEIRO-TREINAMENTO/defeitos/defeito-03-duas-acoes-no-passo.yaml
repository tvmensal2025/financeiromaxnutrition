# Caso RUIM do SRV-ROTEIRO-TREINAMENTO (Isabela, AGT-17) para o pedido ../pedido.yaml (variante CONVERSA). SINTÉTICO.
# Igual à boa-03, com UM defeito plantado. 'deve_falhar_em' diz o ID que tem de pegá-lo:
# CHK-... = portão 1 (código, PORTAO1_RECUSOU); RUB-... = portão 2 (revisor, REPROVAR).
# Serve ao teste 5 (validador) e ao teste 9 do par revisor x roteiro_treinamento (Caio).
id: TREINO-RUIM-03
servico: SRV-ROTEIRO-TREINAMENTO
pedido: ../pedido.yaml
variante: CONVERSA
derivado_de: ../boas/boa-03-conversa-em-casa.yaml
defeito_plantado: O P8 junta duas ações ('assista à gravação inteira e, em seguida, toque em Enviar para avaliação'); o antigo
  P9 sumiu.
deve_falhar_em: CHK-TREINO-03
portao: 1 (código)
motivo_esperado: em seguida
resposta:
  acao: ENTREGAR
  parecer: OK
  acao_externa:
    tipo: SO_FUNDADOR
    acao_do_fundador: AF-TREINAMENTO-ENVIAR
  entrega:
    objetivo: 'Você é participante da Humano Digital e lê isto no celular: ao terminar, você consegue gravar sozinho uma conversa
      em casa com um familiar adulto que concordou, sem mostrar mais ninguém.'
    preparacao:
    - Combine a conversa com um familiar adulto, que esteja na sua casa na hora da gravação.
    - Escolha um cômodo silencioso, sem televisão nem música, com luz suficiente para ver as mãos com nitidez.
    - Tire do cômodo documentos, envelopes e aparelhos com a tela acesa.
    - Reserve o tempo de uma gravação, que dura de 5 a 15 minutos.
    passo_a_passo:
    - id: P1
      o_que_fazer: Explique ao seu familiar que a conversa vai ser gravada.
      sinal: O seu familiar diz que entendeu.
    - id: P2
      o_que_fazer: Pergunte se ele concorda em aparecer e falar na gravação.
      sinal: O seu familiar diz que concorda.
      apoio:
        trecho_original: Rosto ou voz de outra pessoa na gravação, sem a autorização dela, é motivo de reprovação.
        fonte_importada_id: FON-REGRAS-GRAVACAO-01
    - id: P3
      o_que_fazer: Avise as outras pessoas da casa de que vai gravar, para que fiquem em outro cômodo.
      sinal: As outras pessoas ficam em outro cômodo.
      apoio:
        trecho_original: O participante avisa quem mora com ele antes de gravar.
        fonte_importada_id: FON-CONDICOES-PARTICIPANTE-01
    - id: P4
      o_que_fazer: Apoie o celular deitado, na horizontal, em um lugar firme.
      sinal: O celular fica parado, sem balançar.
      apoio:
        trecho_original: Em atividade parada, o celular fica deitado, na horizontal, apoiado em algum lugar firme.
        fonte_importada_id: FON-REGRAS-GRAVACAO-01
    - id: P5
      o_que_fazer: Toque no botão "Gravar".
      sinal: A gravação começou.
      apoio:
        trecho_original: Para começar, a pessoa toca no botão "Gravar" e, para terminar, toca no botão "Parar".
        fonte_importada_id: FON-REGRAS-GRAVACAO-01
    - id: P6
      o_que_fazer: Converse com o seu familiar sobre o seu dia, sem mostrar documentos nem telas.
      sinal: Só vocês dois aparecem e falam na gravação.
      apoio:
        trecho_original: Documentos, telas com dados e endereços não podem aparecer na gravação.
        fonte_importada_id: FON-REGRAS-GRAVACAO-01
    - id: P7
      o_que_fazer: Toque no botão "Parar".
      sinal: A gravação terminou.
      apoio:
        trecho_original: Para começar, a pessoa toca no botão "Gravar" e, para terminar, toca no botão "Parar".
        fonte_importada_id: FON-REGRAS-GRAVACAO-01
    - id: P8
      o_que_fazer: Assista à gravação inteira e, em seguida, toque no botão "Enviar para avaliação".
      sinal: A gravação segue para a avaliação da plataforma.
      apoio:
        trecho_original: Para enviar, a pessoa toca no botão "Enviar para avaliação".
        fonte_importada_id: FON-REGRAS-GRAVACAO-01
    erros_que_reprovam:
    - id: E1
      erro: Gravar a conversa sem a autorização do familiar.
      o_que_acontece: Rosto ou voz de outra pessoa na gravação, sem a autorização dela, é motivo de reprovação.
      como_evitar: Pergunte antes de tocar em "Gravar" e só grave se ele disser que concorda.
      apoio:
        trecho_original: Rosto ou voz de outra pessoa na gravação, sem a autorização dela, é motivo de reprovação.
        fonte_importada_id: FON-REGRAS-GRAVACAO-01
    - id: E2
      erro: Deixar uma criança aparecer ou falar durante a conversa.
      o_que_acontece: Crianças não podem aparecer nem falar em nenhuma gravação.
      como_evitar: Peça que as crianças da casa fiquem em outro cômodo e, se uma aparecer, apague essa parte antes de enviar.
      apoio:
        trecho_original: Crianças não podem aparecer nem falar em nenhuma gravação.
        fonte_importada_id: FON-REGRAS-GRAVACAO-01
    - id: E3
      erro: Deixar documento ou tela com dados à vista.
      o_que_acontece: Documentos, telas com dados e endereços não podem aparecer na gravação.
      como_evitar: Tire do enquadramento documentos, envelopes e aparelhos com a tela acesa antes de começar.
      apoio:
        trecho_original: Documentos, telas com dados e endereços não podem aparecer na gravação.
        fonte_importada_id: FON-REGRAS-GRAVACAO-01
    - id: E4
      erro: Deixar a televisão ou a música ligadas durante a conversa.
      o_que_acontece: O som ao fundo atrapalha a avaliação, e a gravação pode ser reprovada.
      como_evitar: Desligue a televisão e a música e escolha um cômodo silencioso.
      apoio:
        trecho_original: Música, televisão ou som alto ao fundo atrapalham a avaliação, e a gravação pode ser reprovada.
        fonte_importada_id: FON-REGRAS-GRAVACAO-01
    privacidade_e_terceiros:
    - 'A conversa é com uma pessoa só, que autorizou: mais ninguém aparece nem fala na gravação.'
    - 'A autorização é do seu familiar: se ele não quiser, não insista e escolha outra atividade para gravar.'
    - 'Crianças não podem aparecer nem falar: se uma entrar no cômodo, apague essa parte antes de enviar.'
    - Não mostre nem leia em voz alta endereço, documento ou tela com dados, seus ou do seu familiar.
    - Não peça nem anote nenhum dado pessoal do seu familiar.
    checklist_final:
    - 'P2 e E1: o seu familiar disse que concorda em aparecer e falar na gravação?'
    - 'P3 e E2: as crianças e as outras pessoas da casa estão fora do cômodo?'
    - 'E3: não há documento, envelope nem tela com dados à vista?'
    - 'E4: a televisão e a música estão desligadas?'
    - 'P6: só vocês dois aparecem e falam na gravação?'
    - 'P8: você assistiu à gravação inteira antes de enviar?'
    o_que_precisa_aprovacao:
    - 'Como o familiar dá a autorização (na gravação, por escrito ou de outro jeito): a fonte não diz como. Você decide.'
    - 'Canal de dúvidas: o pacote não traz um canal confirmado, então o roteiro não leva nenhum. Diga qual usar.'
    - Enviar o roteiro às pessoas é ação sua, depois do parecer aprovado.
    limites:
    - 'Este roteiro trata apenas da gravação e da privacidade.'
    - 'Conversa fora de casa ou com mais de um familiar: ficam fora deste roteiro.'
