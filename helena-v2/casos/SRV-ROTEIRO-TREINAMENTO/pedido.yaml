  versao_do_catalogo: "3.1.0"
  montado_em: "2026-10-11T09:07:00-03:00"
  etapas:
    - {id: E1, servico: SRV-ROTEIRO-TREINAMENTO, autor: ISABELA, revisores: [CAIO, FUNDADOR], depende_de: [], acao_do_fundador: AF-TREINAMENTO-ENVIAR}
    - {id: E2, servico: SRV-PARECER, autor: CLARA, revisores: [HELENA, FUNDADOR], depende_de: [E1], julga: [E1]}

# Pedidos derivados (empresa, prazo e plano iguais) para as boas 02 e 03 e seus defeitos. O pronto do
