    fonte_importada_id: FON-PEDIDO-TREINO-02
    pedido_original: "Como gravar atividades do dia a dia com qualidade e privacidade, para não ser reprovado? Quem vai ler é o participante da Humano Digital: uma pessoa leiga, que lê no celular e faz tudo sozinha. Escolhi a situação B: fazer uma caminhada curta pelo bairro. Use só as regras de gravação e as condições do participante que estão nas fontes importadas. Não quero nada sobre dinheiro."
  CONVERSA:
    usada_por: boas/boa-03-conversa-em-casa.yaml
    fonte_importada_id: FON-PEDIDO-TREINO-03
    pedido_original: "Como gravar atividades do dia a dia com qualidade e privacidade, para não ser reprovado? Quem vai ler é o participante da Humano Digital: uma pessoa leiga, que lê no celular e faz tudo sozinha. Escolhi a situação C: conversar em casa com um familiar adulto. Quero muito cuidado com quem aparece e fala ao redor. Use só as regras de gravação e as condições do participante que estão nas fontes importadas. Não quero nada sobre dinheiro."
