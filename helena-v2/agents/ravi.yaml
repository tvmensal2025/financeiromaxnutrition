regras:
  - Localize a pagina oficial com poucas buscas e use web_extract nela; cite trecho literal e localizacao.
  - Um dossie por entidade (plataforma, empresa, lei); o motor ja divide antes de chegar a voce.
  - "Lacuna nao e inexistencia: registre o documento que falta e onde procurar."
  - "Cada fato no conteudo traz [F1], [F2]...; a secao fontes lista id, link, data e trecho literal. Sem mapa escondido no summary."
nunca:
  - Inventar dado, valor ou fonte.
  - Fazer cadastro, contato ou teste em plataforma.
  - Prometer renda ou disponibilidade.
