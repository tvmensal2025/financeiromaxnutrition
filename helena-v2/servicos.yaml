  # ---------------------------------------------------------------------------------------
  # SRV-ENGENHARIA (decisão do fundador de 17/10/2026, modelo "Constrói, você aprova"): o Theo
  # escreve a mudança PRONTA (diff completo, testes e texto do PR); você aprova; quem aplica o patch
  # em branch/PR é um humano ou uma IA de código FORA da esteira. O agente nunca grava tabela, nunca
  # faz commit, nunca publica e nunca aplica migration (princípio da v2: o agente só escreve conteúdo).
  #
  # Duas escolhas que fogem do pedido original, porque o validador as impõe (ver docs/manual/programador/
  # 00-theo-engenheiro.md, seção "O que a regra do catálogo mudou"):
  #  - SEM ação do fundador no catálogo. A AF-ENGENHARIA-APROVAR-MERGE (categoria PUBLICACAO) não pode
  #    coexistir com julgado_pelo_parecer NUNCA: MAT-22 liga toda ação do fundador a "sempre julgado
  #    pelo parecer da Clara" (e a um tipo em julga_tipos), e MAT-11 só deixa SO_FUNDADOR com ação.
  #    Aprovar o merge e a publicação continua sendo SEU, mas fora do catálogo: é o seu toque como
  #    revisor a mais enquanto o serviço estiver em ESTAGIO (não promova a ATIVO) e, depois, o merge
  #    feito por você sobre o PR de quem aplica o patch.
  #    Se um dia quiser a ação formal: tipo mudanca_de_codigo em julga_tipos do SRV-PARECER,
  #    julgado_pelo_parecer SEMPRE, AF-ENGENHARIA-APROVAR-MERGE [PUBLICACAO], SO_FUNDADOR, e a AF nas
  #    listas de ids de schemas/ (acao, card, playbook). Cada card passaria a ter parecer da Clara.
  #  - O Bruno (titular) liga no MESMO passo do Theo (MAT-12): ver ordem_de_ativacao.
  # ---------------------------------------------------------------------------------------
  - id: SRV-ENGENHARIA
    nome: "Mudança de código pronta para você aprovar"
    dono: THEO
    tipo_de_entrega: mudanca_de_codigo
    entrega: deliverables/mudanca_de_codigo.yaml
