# ---------------------------------------------------------------------------------------
# Os serviços. Campos de cada um:
#   id, nome (para você), dono, tipo_de_entrega, entrega (arquivo do tipo), revisor (titular),
#   reserva, acoes_permitidas, ferramentas, usa_internet, efeito (sempre interno),
#   acao_externa_permitida (valores de ENTREGAR.acao_externa), acoes_do_fundador (lista
#   fechada, no máximo 1), julgado_pelo_parecer (SEMPRE, SE_O_ROTEIRO_PEDIR ou NUNCA),
#   modelo_menor (NUNCA, SEM_PROVA ou APTO; MAT-25), fase_de_ativacao, estado, empresas,
#   escolhivel (a Helena pode escolher), avulso (o código monta o plano sozinho),
#   pode_entrar_em_roteiro, pode_ser_pulada (teto do que o roteiro pode dizer),
#   pronto_padrao, exemplos_de_pedido, nao_atende.
# Empresas: BIZ-001 iGreen Energy, BIZ-002 Ecossistema de Saúde, BIZ-003 Humano Digital,
# BIZ-004 eLiving™; PESSOAL só para a Laura (organograma.yaml). Serviço publicado lista só
# empresa com pacote CONFIRMADO (MAT-23).
# ---------------------------------------------------------------------------------------
servicos:

  # ===== Coordenação =====
  - id: SRV-RELATORIO-FINAL
    nome: "Relatório final do card"
    dono: HELENA
    tipo_de_entrega: relatorio_final
    entrega: deliverables/relatorio_final.yaml
    revisor: CAIO
    reserva: CLARA
    regra_do_revisor: regra_do_relatorio_final
    acoes_permitidas: [ENTREGAR, REGISTRAR_FALHA]
    ferramentas: []
    usa_internet: false
    efeito: interno
    acao_externa_permitida: [NENHUMA]
    acoes_do_fundador: []
    julgado_pelo_parecer: NUNCA
    modelo_menor: NUNCA
    fase_de_ativacao: "v2.0"
    estado: ESTAGIO
    empresas: [BIZ-003, BIZ-004]
    escolhivel: false
    avulso: false
    pode_entrar_em_roteiro: true
    pode_ser_pulada: false
    pronto_padrao: "Parte montada pelo código (entregas aprovadas, números, riscos, perguntas, fontes, as ações do fundador das etapas aprovadas e os passos fixos do roteiro) e, escrito pela Helena, um resumo de 5 linhas e os próximos passos, cada frase ligada a uma entrega aprovada."
