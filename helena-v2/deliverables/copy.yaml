# Tipo de entrega: copy (v3.1). Formato: schemas/entrega.schema.json.
# Dono: ISABELA (AGT-17). Serviço: SRV-COPY (servicos.yaml). Revisor titular: CAIO (APTA em copy);
# reserva: CAMILA (SEM_PROVA, fora da lista efetiva até o teste 9 e o seu toque); você é sempre a
# última reserva (MAT-03). Julgado depois pela Clara, sempre (julgado_pelo_parecer: SEMPRE, MAT-22):
# por isso a Helena não revisa este tipo (regra 4) e a faixa do card mostra o parecer. Substitui o
# bloco 'copy' de entregas.yaml, que fica só como história.
#
# O que é: o texto pronto que vai a quem é de fora (convite, legenda, mensagem de boas-vindas):
# uma versão final, uma alternativa curta e, junto, a lista de onde vem cada afirmação e do que só
# você decide antes de publicar. Quem escreve é a Isabela; enviar ou publicar é sempre ação sua
# (AF-COPY-ENVIAR-OU-PUBLICAR), depois do parecer aprovado.
#
# Regra de ouro deste tipo (C-11, MAT-16): o convite NÃO recebe a conta do Caio nem nenhum número
# de ganho. Por isso este arquivo não tem seção de dinheiro, nenhuma entrada vem do cálculo e o
# código recusa termo de ganho no texto que sai (CHK-COPY-01). O ganho disfarçado ('seu tempo livre
# pode render muito') o código não pega: é da rubrica (RUB-COPY-03) e, depois, da Clara.
#
# De onde vêm os fatos: só do pacote do card. O código guarda, antes de qualquer IA, o pedido
# original como fonte importada FON-PEDIDO-<card> e o pacote da empresa como FON-PACOTE-<empresa>
# (com as decisões vigentes lidas na hora); fonte importada aprovada que o roteiro ligar ao card
# chega com o id dela. A Isabela não tem ferramenta: não lê página, não busca, não confere perfil
# nem link (MEL-27). O que não está no pacote ou ela pergunta (canal), ou registra a falta, ou
# deixa fora e avisa em o_que_precisa_aprovacao.
#
# As checagens comuns (servicos.yaml, portao1_comum, CHK-COMUM-01 a 10) valem sempre e não se
# repetem aqui: seções e formato (01), tamanho (02), português (03), sem HTML (04), "agi fora"
# (05), citação (06), link (07), autoavaliação (08), grafia da marca (09) e ação externa (10).
# Nenhum critério da rubrica depende de lei (MAT-22): a conferência jurídica (dado pessoal,
# publicidade, imagem, voz, vínculo de trabalho) é do parecer da Clara no mesmo card.
#
# Neutro quanto ao motor (DBOS ou motor próprio): tudo aqui é dado nosso.

tipo: copy
versao: "3.1.0"
descricao: "Texto pronto para quem é de fora (convite, legenda, mensagem): versão final, alternativa curta, de onde vem cada afirmação e o que precisa do seu ok. Nunca tem termo de ganho."
dono: ISABELA
servico: SRV-COPY

secoes:
  - id: onde_usar
    titulo: "Para quem é e onde aparece"
    tipo_de_campo: texto
    obrigatoria: true
    limite_caracteres: 300
    descricao: "Uma frase: quem vai ler, onde o texto aparece (WhatsApp, rede social, mensagem) e o que a pessoa pode fazer ao ler. Não muda o que você pediu."
  - id: versao_final
    titulo: "Versão final"
    tipo_de_campo: texto
    obrigatoria: true
    limite_caracteres: 1200
    descricao: "O texto pronto, em português simples, sem HTML, na voz do pacote da empresa. Só afirma o que o pedido ou o pacote dizem; sem prova, resultado, preço ou contato inventados."
  - id: alternativa_curta
    titulo: "Alternativa curta"
    tipo_de_campo: texto
    obrigatoria: true
    limite_caracteres: 400
    descricao: "Outra versão da mesma mensagem, bem mais curta que a final (no máximo 60% do tamanho dela), com o mesmo convite à ação."
  - id: afirmacoes
    titulo: "De onde vem cada afirmação"
    tipo_de_campo: tabela
    obrigatoria: true
    itens_min: 1
    itens_max: 8
    descricao: "Uma linha por afirmação do texto sobre a empresa, o produto ou a participação: a frase como está no texto e o trecho literal do pedido ou do pacote que a sustenta."
    colunas:
      - {id: id, tipo_de_campo: texto, descricao: "A1 a A8, sem repetir."}
      - {id: frase, tipo_de_campo: texto, descricao: "A frase ou pedaço do texto que afirma, copiado igual da versão final ou da alternativa curta."}
      - {id: apoio, tipo_de_campo: citacao, descricao: "Trecho literal (frase inteira ou 12 palavras seguidas) de uma fonte do pacote: FON-PEDIDO-<card>, FON-PACOTE-<empresa> ou fonte importada aprovada."}
  - id: o_que_precisa_aprovacao
    titulo: "O que precisa do seu ok antes de publicar"
    tipo_de_campo: lista
    obrigatoria: true
    itens_min: 1
    itens_max: 5
    descricao: "O que só você confirma ou preenche antes de usar (canal oficial, data, nome que aparece). Enviar ou publicar é ação sua, depois do parecer aprovado; a Isabela nunca envia."
  - id: limites
    titulo: "O que ficou de fora de propósito"
    tipo_de_campo: lista
    obrigatoria: true
    itens_min: 1
    itens_max: 3
    descricao: "O que o pedido ou o pacote não deixaram entrar no texto e para onde vai (ex.: condições e valores: ficam fora; plano de canais: Camila; texto de voz da empresa: você)."

limite: 5000

checagens_codigo:
  - id: CHK-COPY-01
    descricao: "Sem termo de ganho: nenhum termo da lista fechada (renda, ganho, lucro, salário, dinheiro, reais, dólares, 'por hora', R$, US$ e parecidos) no texto que sai, mesmo negado. O único trecho aceito é o slogan oficial do pacote, literal."
    fecha_furos: [C-11]
    gravidade: RECUSA
    fase: "fase 1"
    parametros:
      termos: ["renda", "rendimento", "rendimentos", "ganho", "ganhos", "ganhar", "ganha", "ganhe", "ganhando", "lucro", "lucros", "lucrar", "remuneração", "remunerado", "remunerada", "salário", "salários", "comissão", "comissões", "dinheiro", "reais", "dólar", "dólares", "pagamento", "pagamentos", "paga", "pagam", "pagar", "bônus", "por hora", "valor por hora", "cachê", "contos", "mil por mês", "vale ouro", "receba por", "ajuda de custo"]
      simbolos: ["R$", "US$", "€"]
      onde: ["versao_final", "alternativa_curta", "afirmacoes.frase"]
      como_compara: "palavra inteira ou expressão inteira, sem diferenciar maiúscula nem acento; símbolo em qualquer posição"
      excecao: "o slogan oficial do pacote da empresa, igual ao pacote (ex.: 'Onde sua evolução ganha direção.')"
      nao_confere: "ganho disfarçado em outras palavras: é da rubrica (RUB-COPY-03)"
  - id: CHK-COPY-02
    descricao: "Nenhum termo proibido pelo pacote da empresa do card (lista fechada do pacote, lida na hora; este arquivo não copia a lista), no texto que sai, sem diferenciar maiúscula nem acento."
    fecha_furos: [DEC-023, DEC-024, DEC-025]
    gravidade: RECUSA
    fase: "fase 1"
    parametros:
      fonte: "pacote da empresa do card: termos_proibidos_em_todo_texto"
      onde: ["versao_final", "alternativa_curta", "afirmacoes.frase"]
      sem_lista_no_pacote: "passa, e a faixa mostra 'pacote sem lista de termos'"
  - id: CHK-COPY-03
    descricao: "Sem promessa nem pressão da lista fechada: garantia, 'sem risco', vaga garantida, escassez ou urgência inventada ('últimas vagas', 'só hoje', 'corra'), mesmo negada."
    fecha_furos: [C-11, C-13]
    gravidade: RECUSA
    fase: "fase 1"
    parametros:
      termos: ["garantido", "garantida", "garantidos", "garantidas", "garantimos", "garantia", "garanto", "garantir", "com certeza", "sem risco", "sem riscos", "risco zero", "resultado certo", "resultado garantido", "vaga garantida", "vagas limitadas", "vaga limitada", "vaga é limitada", "últimas vagas", "última vaga", "poucas vagas", "só hoje", "apenas hoje", "corra", "corram", "última chance", "chance única", "não perca essa chance", "oportunidade única", "milagre", "milagres"]
      onde: ["versao_final", "alternativa_curta", "afirmacoes.frase"]
      como_compara: "palavra inteira ou expressão inteira, sem diferenciar maiúscula nem acento"
      nao_confere: "pressão em outras palavras ('não fique de fora'): é da rubrica (RUB-COPY-04)"
  - id: CHK-COPY-04
    descricao: "Sem orientação de saúde: nenhum termo da lista fechada de diagnóstico, prescrição, remédio, tratamento, cura ou emagrecimento no texto que sai, mesmo negado."
    fecha_furos: [DEC-023, C-13]
    gravidade: RECUSA
    fase: "fase 1"
    parametros:
      termos: ["diagnóstico", "diagnósticos", "diagnosticar", "diagnostica", "diagnosticado", "prescrição", "prescrições", "prescrever", "prescreve", "receita médica", "medicamento", "medicamentos", "remédio", "remédios", "tratamento médico", "tratamento da ansiedade", "tratar doenças", "cura", "curar", "cure", "curado", "emagrecer", "emagreça", "emagrece", "emagrecimento", "perder peso", "perca peso", "perda de peso"]
      onde: ["versao_final", "alternativa_curta", "afirmacoes.frase"]
      como_compara: "palavra inteira ou expressão inteira, sem diferenciar maiúscula nem acento"
      nao_confere: "conselho de saúde individual em outras palavras: é da rubrica (RUB-COPY-05)"
  - id: CHK-COPY-05
    descricao: "A eLiving™ não vira app de calorias: no card da eLiving™ (BIZ-004), nenhum termo da lista fechada de caloria, dieta ou app fitness no texto que sai, mesmo negado."
    fecha_furos: [DEC-023]
    gravidade: RECUSA
    fase: "fase 1"
    parametros:
      so_empresa: BIZ-004
      termos: ["caloria", "calorias", "contador de calorias", "contar calorias", "app fitness", "aplicativo fitness", "plataforma fitness", "app de treino", "plano alimentar", "kcal", "macros", "app de dieta", "aplicativo de dieta", "app de academia", "aplicativo de academia", "dieta", "dietas"]
      onde: ["versao_final", "alternativa_curta", "afirmacoes.frase"]
      como_compara: "palavra inteira ou expressão inteira, sem diferenciar maiúscula nem acento"
      nao_confere: "a eLiving™ descrita como outra coisa que não inteligência pessoal de evolução: é da rubrica (RUB-COPY-07)"
  - id: CHK-COPY-06
    descricao: "Nenhum contato inventado: link, e-mail, @usuário, telefone, CPF ou CEP no texto só se aparecer igual no pedido original ou no pacote."
    fecha_furos: [DEC-023, C-7]
    gravidade: RECUSA
    fase: "fase 1"
    parametros:
      padroes: ["endereço de site (http, https, www ou nome seguido de .com, .br, .org, .net, .app, .io, .ee, .gl, .ly, .me, .xyz, .ai, .uk)", "e-mail", "@usuário", "telefone com 8 ou 9 dígitos, com ou sem DDD", "CPF (000.000.000-00)", "CEP (00000-000)"]
      onde: ["versao_final", "alternativa_curta", "afirmacoes.frase"]
      fontes_aceitas: ["FON-PEDIDO-<card>", "FON-PACOTE-<empresa>"]
      sem_canal_confirmado: "o texto não leva canal e o item de o_que_precisa_aprovacao diz qual canal falta"
  - id: CHK-COPY-07
    descricao: "Nenhum número solto: todo número em algarismos do texto que sai aparece, com o mesmo valor, no pedido original ou no pacote."
    fecha_furos: [C-9, C-11]
    gravidade: RECUSA
    fase: "fase 1"
    parametros:
      onde: ["versao_final", "alternativa_curta", "afirmacoes.frase"]
