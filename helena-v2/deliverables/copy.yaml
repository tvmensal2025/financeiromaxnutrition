      compara: "valor numérico igual ao de um número da fonte aceita"
      ignora: ["ids A1-A8", "datas dd/mm/aaaa e horas hh:mm que estão no pedido"]
      fontes_aceitas: ["FON-PEDIDO-<card>", "FON-PACOTE-<empresa>"]
  - id: CHK-COPY-08
    descricao: "Afirmações com apoio: toda frase da tabela afirmacoes aparece igual na versão final ou na alternativa, e o apoio é trecho literal (frase inteira ou 12 palavras seguidas) de fonte do pacote que existe."
    fecha_furos: [C-8, M-15]
    gravidade: RECUSA
    fase: "fase 1"
    parametros:
      ids: "^A[1-8]$"
      fontes_aceitas: ["FON-PEDIDO-<card>", "FON-PACOTE-<empresa>", "fonte importada aprovada que veio no pacote do card"]
      minimo_palavras: 12
      aceita_frase_inteira: true
      normaliza: ["espaços repetidos", "aspas tipográficas"]
      nunca_aceita: "leitura_id (a Isabela não lê página)"
  - id: CHK-COPY-09
    descricao: "A alternativa é curta de verdade: no máximo 400 caracteres e no máximo 60% do tamanho da versão final."
    fecha_furos: [CONF-21]
    gravidade: RECUSA
    fase: "fase 1"
    parametros:
      maximo_caracteres: 400
      maximo_proporcao: 0.6
  - id: CHK-COPY-10
    descricao: "Sem pedir dado sensível no canal aberto: o texto que sai não pede CPF, RG, senha, código de verificação, dados bancários, foto de documento ou exame, mesmo negado."
    fecha_furos: [C-11, M-13]
    gravidade: RECUSA
    fase: "fase 1"
    parametros:
      termos: ["CPF", "RG", "CNH", "senha", "código de verificação", "código por SMS", "código que chegar por SMS", "número do cartão", "número do seu cartão", "cartão de crédito", "dados bancários", "conta bancária", "foto do documento", "foto do seu documento", "foto da sua identidade", "documento com foto", "exame", "exames", "laudo", "laudos"]
      siglas_maiusculas_palavra_inteira: ["CPF", "RG", "CNH"]
      onde: ["versao_final", "alternativa_curta", "afirmacoes.frase"]
      como_compara: "palavras sem diferenciar maiúscula nem acento; siglas em qualquer caixa e como palavra inteira"

rubrica:
  - id: RUB-COPY-01
    pergunta: "O texto serve ao pedido: fala com o público e no canal que o pedido diz, e o único passo que pede da pessoa é o que o pedido autoriza?"
    evidencia_exigida: TRECHO
    risco: BAIXO
    por_que_o_codigo_nao_confere: "Comparar o público, o canal e o passo pedido com o que o texto faz é leitura."
    vereditos: [PASSOU, FALHOU, NAO_CONSIGO_CONFERIR]
  - id: RUB-COPY-02
    pergunta: "Toda afirmação do texto sobre a empresa, o produto ou a participação tem apoio no pedido ou no pacote, sem depoimento, resultado, número de pessoas ou prova que ninguém informou?"
    evidencia_exigida: TRECHO
    risco: ALTO
    por_que_o_codigo_nao_confere: "O código confere as linhas da tabela; uma afirmação que ficou fora dela, ou um apoio que não diz o mesmo, só a leitura pega."
    vereditos: [PASSOU, FALHOU, NAO_CONSIGO_CONFERIR]
  - id: RUB-COPY-03
    pergunta: "Nenhum trecho insinua ganho ou vantagem financeira, mesmo sem usar as palavras da lista (ex.: 'seu tempo livre vira recompensa', 'complemente o orçamento')?"
    evidencia_exigida: AUSENCIA
    risco: ALTO
    por_que_o_codigo_nao_confere: "A lista fechada pega as palavras; a mesma promessa dita de outro jeito (C-11, ganho disfarçado) só a leitura pega."
    vereditos: [PASSOU, FALHOU, NAO_CONSIGO_CONFERIR]
  - id: RUB-COPY-04
    pergunta: "Nenhum trecho pressiona ou promete sem base (urgência ou escassez inventadas, 'todo mundo já está', 'não fique de fora'), e a pessoa vê que pode não responder ou tirar dúvida antes?"
    evidencia_exigida: AUSENCIA
    risco: ALTO
    por_que_o_codigo_nao_confere: "A lista fechada pega as expressões conhecidas; a pressão dita de outro jeito, e se a pessoa tem saída, só a leitura pega."
    vereditos: [PASSOU, FALHOU, NAO_CONSIGO_CONFERIR]
  - id: RUB-COPY-05
    pergunta: "Em assunto de saúde, o texto fica em informação geral e acolhimento, sem dar orientação para a situação de uma pessoa nem sugerir que substitui médico, nutricionista ou educador físico?"
    evidencia_exigida: AUSENCIA
    risco: ALTO
    por_que_o_codigo_nao_confere: "A lista fechada pega as palavras; o conselho para o caso de alguém, em palavras comuns, só a leitura pega."
    vereditos: [PASSOU, FALHOU, NAO_CONSIGO_CONFERIR]
  - id: RUB-COPY-06
    pergunta: "A voz é a da empresa do pacote (jeito de falar, tratamento por 'você', slogan quando for usá-lo) e uma pessoa leiga entende na primeira leitura, sem jargão nem frase longa demais?"
    evidencia_exigida: TEXTO_INTEIRO
    risco: BAIXO
    por_que_o_codigo_nao_confere: "Tom, voz e clareza para quem lê são julgamento sobre o texto inteiro."
    vereditos: [PASSOU, FALHOU, NAO_CONSIGO_CONFERIR]
  - id: RUB-COPY-07
    pergunta: "Nenhum trecho faz a eLiving™ parecer app de dieta, de academia ou contador de calorias, nem apresenta Sirlene, Doutor Vital, Alex ou Rafael como pessoas reais, profissionais de saúde ou funcionários?"
    evidencia_exigida: AUSENCIA
    risco: ALTO
    por_que_o_codigo_nao_confere: "A lista fechada pega as palavras; o produto ou os personagens descritos de outro jeito só a leitura pega."
    vereditos: [PASSOU, FALHOU, NAO_CONSIGO_CONFERIR]
  - id: RUB-COPY-08
    pergunta: "Cada pendência que o texto deixa para o seu ok é a que de fato falta (canal, data, nome), dita com clareza, sem esconder o que mudaria o texto nem deixar buraco como 'link abaixo' sem o link?"
    evidencia_exigida: TRECHO
    risco: BAIXO
    por_que_o_codigo_nao_confere: "O código vê que a seção existe; se ela diz o que falta de verdade só a leitura confere."
    vereditos: [PASSOU, FALHOU, NAO_CONSIGO_CONFERIR]

# Pronto em 3 camadas. Camada 1 (código): as comuns valem sempre, mais as deste tipo. Camada 2
# (rubrica): toda a rubrica, mais os itens CARD-n de IA do card. Camada 3 (você): só quando a
# entrega propõe a ação AF-COPY-ENVIAR-OU-PUBLICAR; mesmo assim ela só nasce na sua lista quando o
# card fica PRONTO, com o parecer aprovado por você no mesmo card (MAT-22). Nenhum padrão aprova.
criterio_de_pronto:
  codigo: [CHK-COPY-01, CHK-COPY-02, CHK-COPY-03, CHK-COPY-04, CHK-COPY-05, CHK-COPY-06, CHK-COPY-07,
           CHK-COPY-08, CHK-COPY-09, CHK-COPY-10]
  rubrica: [RUB-COPY-01, RUB-COPY-02, RUB-COPY-03, RUB-COPY-04, RUB-COPY-05, RUB-COPY-06, RUB-COPY-07,
            RUB-COPY-08]
  fundador:
    quando: QUANDO_HA_ACAO_EXTERNA
    o_que_confere: "Você lê o texto, preenche o que falta (canal oficial, data) e é você quem envia ou publica, uma vez, depois do parecer aprovado. A Isabela nunca envia nem publica."

temas_obrigatorios:
  - id: TEMA-GANHO-E-PROMESSA
    tema: "Ganho, renda e promessa enganosa em vendas"
    como_conferir: "CHK-COPY-01 e CHK-COPY-03 (palavras da lista), RUB-COPY-03 e RUB-COPY-04 (disfarçado); a Clara julga a promessa no parecer. O convite nunca recebe a conta (MAT-16)."
  - id: TEMA-PROVA-INVENTADA
    tema: "Depoimento, resultado, número de pessoas e preço inventados"
    como_conferir: "CHK-COPY-07 (número solto), CHK-COPY-08 (apoio literal) e RUB-COPY-02 (afirmação fora da tabela)."
  - id: TEMA-DADOS-PESSOAIS
    tema: "Dados pessoais (LGPD): contato de terceiros, dado sensível e recusa"
    como_conferir: "CHK-COPY-06 (contato só do pacote) e CHK-COPY-10 (não pede dado sensível); RUB-COPY-04 (a pessoa pode não responder). O enquadramento legal é da Clara no parecer."
  - id: TEMA-SAUDE-SEM-ORIENTACAO
    tema: "Orientação médica individual em saúde"
    como_conferir: "CHK-COPY-04 (palavras da lista) e RUB-COPY-05 (conselho para o caso de alguém, ou substituir profissional)."
  - id: TEMA-ELIVING-NAO-E-APP-DE-CALORIAS
    tema: "eLiving™ é inteligência pessoal de evolução, nunca app de calorias; os quatro pilares são personagens"
    como_conferir: "CHK-COPY-05 (calorias, dieta, app fitness), CHK-COMUM-09 (grafia eLiving™) e RUB-COPY-07 (produto e personagens descritos de outro jeito)."
  - id: TEMA-VINCULO-DE-TRABALHO
    tema: "Convite que parece oferta de emprego ou contratação"
    como_conferir: "CHK-COPY-02 (termos do pacote da Humano Digital, como emprego e contratação) e RUB-COPY-01; o enquadramento do vínculo é da Clara no parecer."

revisor_confere:
  - "Se o texto serve ao público, ao canal e ao passo que o pedido diz (RUB-COPY-01)."
  - "Se toda afirmação sobre a empresa, o produto ou a participação tem apoio, sem prova inventada (RUB-COPY-02)."
  - "Se nenhum trecho insinua ganho ou vantagem financeira, mesmo sem as palavras da lista (RUB-COPY-03)."
  - "Se nada pressiona nem promete sem base e a pessoa pode não responder (RUB-COPY-04)."
  - "Se, em saúde, fica em informação geral, sem orientação para o caso de alguém (RUB-COPY-05)."
  - "Se a voz é a do pacote e uma pessoa leiga entende na primeira leitura (RUB-COPY-06)."
  - "Se a eLiving™ não parece app de dieta, academia ou calorias e os quatro pilares não aparecem como pessoas reais (RUB-COPY-07)."
  - "Se as pendências para o seu ok são as que de fato faltam, sem buraco no texto (RUB-COPY-08)."

revisor_nao_reavalia:
  - "Termo de ganho, termo proibido do pacote, promessa e pressão da lista, número solto, contato inventado, tamanho da alternativa e pedido de dado sensível: o código já conferiu (CHK-COPY-01 a 10)."
  - "Se a afirmação do pacote é verdadeira no mundo: só você; o revisor julga se há apoio literal e se o texto diz o mesmo que ele."
  - "Lei, publicidade, imagem, voz e vínculo de trabalho: é do parecer da Clara (MAT-22); o revisor não decide o que é permitido."
  - "Plano de canais e estratégia da campanha: são da Camila; o revisor não pede que entrem no texto."
