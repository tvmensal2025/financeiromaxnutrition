# Tipo de entrega: relatorio_final (v3.1). Formato: schemas/entrega.schema.json.
# Dono: HELENA. Serviço: SRV-RELATORIO-FINAL (servicos.yaml). Revisor titular: CAIO; reserva: CLARA;
# você é sempre a última reserva (MAT-03). Substitui o bloco 'relatorio_final' de entregas.yaml.
#
# O relatório tem DUAS partes (MEL-30 corrigida; plano v3, "O relatório do card"):
#   1. Parte montada pelo CÓDIGO (não é escrita por agente nenhum e não está nesta entrega):
#      referências às entregas aprovadas de cada etapa (etapa + versão aprovada + campo, nunca cópia
#      de texto), números, todos os riscos, perguntas abertas e itens sem conferir de qualquer etapa,
#      fontes, a lista do que só você faz (ação do fundador de cada etapa aprovada, com o texto fixo
#      do roteiro, e os passos fixos do roteiro) e a faixa do código. Se uma etapa aprovada mudar,
#      a máquina reabre o relatório (regra 10: DEPENDENCIA_MUDOU).
#   2. Parte ESCRITA pela Helena (esta entrega): 'resumo' e 'proximos_passos'. Cada linha tem
#      'refs' (campo, nunca texto) que a liga ao que foi aprovado. O app mostra o nome da ref
#      ("conta do Caio"), nunca o código.
#
# Valores aceitos em 'refs' (separados por vírgula):
#   - E1..E12: etapa do plano DESTE card, diferente da etapa do relatório, aprovada na versão que
#     veio no pacote;
#   - AF-...: id da ação do fundador que o plano deu a uma etapa aprovada (se o mesmo id estiver em
#     duas etapas, a ref da etapa vai junto na mesma linha);
#   - PF-nn: passo fixo do roteiro, da parte montada pelo código;
#   - PEDIDO: a ordem de serviço do card (pedido original, o que você quer, como é o pronto, o que
#     não pode, prazo).
#
# Neutro quanto ao motor: tudo aqui é dado nosso; nada depende de DBOS nem de motor próprio.

tipo: relatorio_final
versao: "3.1.0"
descricao: >-
  O que você lê ao abrir o card pronto de um roteiro. O código monta as entregas aprovadas,
  números, riscos, perguntas, fontes e o que só você faz; a Helena escreve só o resumo e os
  próximos passos, cada linha ligada ao que foi aprovado.
dono: HELENA
servico: SRV-RELATORIO-FINAL

secoes:
  - id: resumo
    titulo: "Resumo em até 5 frases"
    tipo_de_campo: tabela
    obrigatoria: true
    itens_min: 1
    itens_max: 5
    limite_caracteres: 1500
    descricao: >-
      Uma frase por linha: o que ficou pronto, o que depende de você e o maior risco, ligada às
      refs. Com a faixa do código vermelha, o app não mostra este resumo (C-13).
    colunas:
      - {id: frase, tipo_de_campo: texto, descricao: "Uma frase, até 280 caracteres, em português simples."}
      - {id: refs, tipo_de_campo: texto, descricao: "Etapas aprovadas, AF-, PF- ou PEDIDO, separados por vírgula."}
  - id: proximos_passos
    titulo: "Próximos passos (todos seus)"
    tipo_de_campo: tabela
    obrigatoria: true
    itens_min: 1
    itens_max: 8
    limite_caracteres: 2000
    descricao: >-
      O que você faz depois do card pronto, na ordem. Ação de fora só aparece repetindo um item da
      lista do que só você faz (com o AF- ou PF- nas refs); a Helena não cria ação nova nem data.
    colunas:
      - {id: ordem, tipo_de_campo: numero, descricao: "1, 2, 3... sem pular nem repetir."}
      - {id: passo, tipo_de_campo: texto, descricao: "O que você faz, até 240 caracteres."}
      - {id: depois_de, tipo_de_campo: texto, descricao: "'nada' ou as ordens de passos anteriores, separadas por vírgula."}
      - {id: refs, tipo_de_campo: texto, descricao: "Etapas aprovadas, AF-, PF- ou PEDIDO, separados por vírgula."}

limite: 3500

# Checagens do portão 1, por código. As comuns (CHK-COMUM-01 a 10, servicos.yaml portao1_comum)
# valem sempre e não se repetem aqui. Cada ID é o nome de uma função em helena-v2/checagens/, com
# caso bom (casos/SRV-RELATORIO-FINAL/boas/) e caso ruim (casos/SRV-RELATORIO-FINAL/defeitos/).
# "fase 2" = a função depende da parte montada pelo código, que nasce com o motor.
checagens_codigo:
  - id: CHK-REL-SO-SECOES
    descricao: >-
      A entrega só tem as seções resumo e proximos_passos, cada linha só com as colunas declaradas.
      Qualquer outra chave (entregas, números, riscos, fontes, ações) recusa: essa parte é do código.
    fecha_furos: [C-13]
    gravidade: RECUSA
    fase: "fase 1"
  - id: CHK-REL-TAMANHO-DAS-LINHAS
    descricao: >-
      Cada frase do resumo tem até 280 caracteres e cada passo até 240; refs e depois_de não vazios.
    fecha_furos: [CONF-21]
    gravidade: RECUSA
    fase: "fase 1"
    parametros: {frase_max: 280, passo_max: 240}
  - id: CHK-REL-ORDEM
    descricao: >-
      Em proximos_passos, 'ordem' vai de 1 a n sem pular nem repetir, e 'depois_de' é 'nada' ou só
      cita ordens menores que a da própria linha.
    fecha_furos: [A-17, K-13]
    gravidade: RECUSA
    fase: "fase 1"
  - id: CHK-REL-SEM-CODIGO
    descricao: >-
      Nas colunas frase e passo, nenhum código interno: ids (AGT-, JOB-, DEC-, SRV-, AF-, PF-, CHK-,
      RUB-...), etapa como 'E4', nome da máquina em MAIÚSCULAS_COM_TRAÇO, identidade em maiúsculas
      ou apelido de modelo. As refs ficam só na coluna refs.
    fecha_furos: [CONF-21]
    gravidade: RECUSA
    fase: "fase 1"
    parametros:
      colunas: [frase, passo]
      padroes:
        - '\b(AGT|JOB|MEM|TSK|DEC|CHK|RUB|SRV|BIZ|AF|PF|LIC|LEI|FON|CARD|ENT|TEMA|MAT|MEL)-[A-Za-z0-9]'
        - '\bE[0-9]{1,2}\b'
        - '\b[A-Z]{2,}(_[A-Z0-9]+)+\b'
        - '\b(HELENA|LAURA|AUGUSTO|MARINA|CAIO|CLARA|BIANCA|DANIEL|THEO|NINA|RAVI|MAYA|BRUNO|OLIVIA|VICTOR|CAMILA|ISABELA|PEDRO|RENATA|JOANA|FELIPE|FUNDADOR)\b'
        - '\b(coordenacao|revisao|analise|pesquisa|conteudo)-padrao\b'
  - id: CHK-REL-SEM-OTIMISMO
    descricao: >-
      Nenhuma frase de garantia ou de 'tudo resolvido' no texto da Helena (lista fechada): o card
      sempre mostra o que ficou sem conferir, e ninguém promete 'zero furo' (a frase certa, 'nenhum
      furo conhecido em aberto', não está na lista).
    fecha_furos: [C-13]
    gravidade: RECUSA
    fase: "fase 1"
    parametros:
      colunas: [frase, passo]
      termos: ["tudo certo", "tudo resolvido", "tudo pronto para agir", "tudo ok", "sem riscos", "sem risco", "sem nenhum risco", "nenhum risco",
               "risco zero", "zero furo", "zero furos", "100% seguro", "cem por cento seguro", "totalmente seguro", "completamente seguro",
               "pode agir sem ler", "sem pendências", "sem pendência", "nada a conferir", "nada para conferir"]
      sem_diferenca_de_maiusculas: true
  - id: CHK-REL-PACOTE
    descricao: >-
      Nenhum termo proibido em todo texto pelo pacote da empresa do card (lista fechada do pacote,
      lida na hora; esta ficha não copia a lista).
    fecha_furos: [DEC-023]
    gravidade: RECUSA
    fase: "fase 1"
    parametros: {fonte: "pacote da empresa do card: termos_proibidos_em_todo_texto", colunas: [frase, passo]}
  - id: CHK-REL-REFS
    descricao: >-
      Toda linha tem refs, e cada ref é: etapa deste card, que não é o relatório, aprovada na versão
      do pacote; AF- dado pelo plano a uma etapa aprovada; PF- da parte montada; ou PEDIDO. Outra
      ref recusa.
    fecha_furos: [C-13, A-1]
    gravidade: RECUSA
    fase: "fase 2"
  - id: CHK-REL-NUMEROS
    descricao: >-
      Todo número escrito em frase ou passo (algarismos, com vírgula ou ponto, %, R$, US$) aparece,
      normalizado, numa fonte citada nas refs da mesma linha: entrega aprovada, texto fixo do AF ou
      do PF, ou a ordem de serviço (PEDIDO).
    fecha_furos: [K-8, C-13]
    gravidade: RECUSA
    fase: "fase 2"
    parametros:
      colunas: [frase, passo]
      formato: "brasileiro: ponto separa milhar e vírgula separa decimal (2.500 = 2500; 0,50 = 0,5)"
      fonte_conta: "texto da fonte e campos numero (valor) da entrega aprovada"
  - id: CHK-REL-RISCO-ALTO-NO-RESUMO
    descricao: >-
      Para cada etapa que a parte montada pelo código traz com risco ALTO, pergunta aberta ou item
      sem conferir, pelo menos uma linha com conteúdo do resumo tem essa etapa nas refs.
    fecha_furos: [C-13]
    gravidade: RECUSA
    fase: "fase 2"
    parametros:
      min_palavras_com_conteudo: 2
      min_letras_palavra: 4
  - id: CHK-REL-SEM-ACAO-NOVA
    descricao: >-
      Linha com verbo de ação de fora (lista fechada) precisa ter nas refs um AF- de etapa aprovada
      ou um PF- da parte montada pelo código; sem isso, é ação nova da IA e recusa.
    fecha_furos: [B-17, CONF-20]
    gravidade: RECUSA
    fase: "fase 2"
    parametros:
      colunas: [frase, passo]
      sem_diferenca_de_maiusculas: true
      verbos_regex:   # infinitivo, imperativo, gerúndio e particípio (ex.: 'pode ser enviado')
        - '\bcadastr(ar|e|em|ando|ad[oa]s?)\b'
        - '\binscrev(er|a|am|endo)\b|\binscrit[oa]s?\b'
        - '\benvi(ar|e|em|ando|ad[oa]s?)\b'
        - '\bmand(ar|e|em|ando)\b'
        - '\bdispar(ar|e|em|ad[oa]s?)\b'
        - '\bpublic(ar|ando|ad[oa]s?)\b|\bpubliqu(e|em)\b'
        - '\bpost(ar|e|em|ad[oa]s?)\b'
        - '\bdivulg(ar|ue|uem|ad[oa]s?)\b'
        - '\banunci(ar|e|em)\b'
        - '\bpag(ar|ue|uem|ando)\b'
        - '\btransfer(ir|a|am)\b'
        - '\bcompr(ar|e|em)\b'
        - '\bcontrat(ar|e|em|ando|ad[oa]s?)\b'
        - '\bassin(ar|e|em|ando|ad[oa]s?)\b'
        - '\brenov(ar|e|em|ad[oa]s?)\b'
        - '\blig(ar|ue|uem) (?:para|pra)\b|\btelefon(ar|e|em|ando)\b'
        - '\bcontat(ar|e|em|ando|ad[oa]s?)\b'
        - '\bconvid(ar|e|em|ad[oa]s?)\b'
        - '\babord(ar|e|em|ad[oa]s?)\b'
        - '\bnegoci(ar|e|em)\b'
        - '\bcolo(car|que) no ar\b|\bdeix(ar|e) no ar\b'
        - '\brespond(er|a|am)\b (ao|à|aos|às) (cliente|participante|pessoa)'
        - '\b(envio|publicacao|pagamento|disparo|contratacao|transferencia)\b'
        - '\b(pix|mandado|mandada|transferido|transferida|chame|chamar|compartilhe|compartilhar|send|post)\b|^\s*manda\b'

# Rubrica do portão 2 (revisor: Caio; reserva: Clara). Só julgamento que o código não confere.
# Nenhum critério depende de lei (quem julga lei é só o parecer; MAT-22). Nenhum reavalia mérito.
rubrica:
  - id: RUB-REL-01
    pergunta: "Cada frase do resumo e cada passo diz o mesmo que a entrega aprovada que cita, sem exagerar, sem atenuar e sem acrescentar conclusão que ela não tem?"
    evidencia_exigida: TRECHO
    risco: ALTO
    por_que_o_codigo_nao_confere: "Sentido igual entre duas frases é julgamento; o código só confere que a ref existe e que os números estão nela."
    vereditos: [PASSOU, FALHOU, NAO_CONSIGO_CONFERIR]
  - id: RUB-REL-02
    pergunta: "Nenhuma frase suaviza, contradiz ou tira o peso de um risco, de uma pergunta aberta ou de um item sem conferir que a parte montada pelo código mostra?"
    evidencia_exigida: AUSENCIA
    risco: ALTO
    por_que_o_codigo_nao_confere: "O código confere que a etapa do risco está citada no resumo, não o tom com que o risco foi descrito."
    vereditos: [PASSOU, FALHOU, NAO_CONSIGO_CONFERIR]
  - id: RUB-REL-03
    pergunta: "Os próximos passos seguem as dependências das entregas citadas (ex.: o passo fixo que o parecer pôs como condição vem antes da ação que depende dele)?"
    evidencia_exigida: TRECHO
    risco: ALTO
    por_que_o_codigo_nao_confere: "O código só confere a numeração; qual passo depende de qual sai do conteúdo das entregas."
    vereditos: [PASSOU, FALHOU, NAO_CONSIGO_CONFERIR]
  - id: RUB-REL-04
    pergunta: "Nenhum passo pede, com outras palavras, uma ação de fora que não está na lista do que só você faz (ex.: 'chame os interessados', 'espalhe nos grupos')?"
    evidencia_exigida: AUSENCIA
    risco: ALTO
    por_que_o_codigo_nao_confere: "A lista fechada de verbos não pega paráfrase; reconhecer pedido de ação disfarçado é julgamento."
    vereditos: [PASSOU, FALHOU, NAO_CONSIGO_CONFERIR]
  - id: RUB-REL-05
    pergunta: "O resumo responde ao que você pediu no card (o que quer e como é o pronto), dizendo o que ficou pronto e o que ainda depende de você?"
    evidencia_exigida: TRECHO
    risco: BAIXO
    por_que_o_codigo_nao_confere: "Saber se o texto responde ao pedido é julgamento de sentido."
    vereditos: [PASSOU, FALHOU, NAO_CONSIGO_CONFERIR]
  - id: RUB-REL-06
    pergunta: "Uma pessoa leiga entende cada frase e cada passo e consegue fazer ou decidir cada passo só com o que está no card?"
    evidencia_exigida: TEXTO_INTEIRO
    risco: BAIXO
    por_que_o_codigo_nao_confere: "Clareza para quem não é do ramo é julgamento sobre o texto inteiro."
    vereditos: [PASSOU, FALHOU, NAO_CONSIGO_CONFERIR]

criterio_de_pronto:
  codigo: [CHK-REL-SO-SECOES, CHK-REL-TAMANHO-DAS-LINHAS, CHK-REL-ORDEM, CHK-REL-SEM-CODIGO,
           CHK-REL-SEM-OTIMISMO, CHK-REL-PACOTE, CHK-REL-REFS, CHK-REL-NUMEROS,
           CHK-REL-RISCO-ALTO-NO-RESUMO, CHK-REL-SEM-ACAO-NOVA]
  rubrica: [RUB-REL-01, RUB-REL-02, RUB-REL-03, RUB-REL-04, RUB-REL-05, RUB-REL-06]
  fundador:
    quando: NUNCA    # o relatório não tem ação do fundador (MAT-11, MAT-15); o seu Aprovar no card pronto não substitui a revisão

revisor_confere:
  - "Fidelidade: cada frase escrita pela Helena diz o mesmo que a entrega aprovada que ela cita, sem exagero nem atenuação (RUB-REL-01)."
  - "Nada escondido: nenhum risco, pergunta aberta ou item sem conferir foi suavizado ou contradito (RUB-REL-02)."
  - "Ordem: os próximos passos respeitam as dependências das entregas e dos passos fixos do roteiro (RUB-REL-03)."
  - "Nenhum passo pede ação de fora disfarçada, fora da lista do que só você faz (RUB-REL-04)."
  - "O resumo responde ao seu pedido e diz o que ainda depende de você (RUB-REL-05)."
  - "Linguagem simples, executável por leigo (RUB-REL-06)."
  - "Revisa sem internet e sem ferramenta, com revisao-padrao; o código entrega as entregas aprovadas citadas nas refs."

revisor_nao_reavalia:
  - "O mérito de nenhuma entrega aprovada, inclusive a do próprio revisor (o Caio fez o cálculo; a Clara, reserva, fez o parecer): entrega aprovada não volta a ser julgada no relatório."
  - "A parte montada pelo código (entregas aprovadas, números, riscos, perguntas, fontes, as ações do fundador das etapas aprovadas e os passos fixos do roteiro): ninguém a reescreve."
  - "Lei ou risco jurídico: quem julga lei é só o parecer (MAT-22)."
  - "As contas: o código já refez cada conta na etapa do cálculo; o revisor do relatório só confere que o número citado é o da entrega."
  - "Quem revisa o relatório nunca é a autora dele (Helena) e revisa sem internet (regra_do_relatorio_final)."

entrada_minima:
  - {id: ENT-REL-PEDIDO, o_que: "Ordem de serviço do card: pedido original, o que você quer, como é o pronto, o que não pode e prazo.", de_onde: PEDIDO_DO_CARD, se_faltar: REGISTRAR_FALHA}
  - {id: ENT-REL-ENTREGAS, o_que: "Cada entrega aprovada das etapas de que o relatório depende, na versão aprovada, com quem fez e quem revisou.", de_onde: ENTREGA_APROVADA, se_faltar: REGISTRAR_FALHA}
  - {id: ENT-REL-MONTADO, o_que: "Parte montada pelo código: números, riscos, perguntas abertas, itens sem conferir e fontes de cada etapa, e as ações do fundador das etapas aprovadas, com id.", de_onde: ENTREGA_APROVADA, se_faltar: REGISTRAR_FALHA}
  - {id: ENT-REL-PASSOS-FIXOS, o_que: "Passos fixos do roteiro: id, texto fixo e a etapa de parecer que cobre cada um.", de_onde: PASSOS_FIXOS_DO_ROTEIRO, se_faltar: REGISTRAR_FALHA}
  - {id: ENT-REL-PACOTE, o_que: "Pacote da empresa do card: grafia, voz e termos proibidos.", de_onde: PACOTE_DA_EMPRESA, se_faltar: REGISTRAR_FALHA}
  - {id: ENT-REL-DECISOES, o_que: "Decisões vigentes lidas na hora, com a versão de cada uma.", de_onde: DECISAO_VIGENTE, se_faltar: REGISTRAR_FALHA}
