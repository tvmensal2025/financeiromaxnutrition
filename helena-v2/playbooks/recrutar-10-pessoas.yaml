# ROTEIRO DA PRIMEIRA META: recrutar as 10 primeiras pessoas na Mimix e no Hub (Humano Digital, BIZ-003).
#
# O que é: a lista de etapas que o código segue quando você escolhe esta meta no app. Formato v3.1,
#   conferido por schemas/playbook.schema.json e pelas regras ROTEIRO-* e MAT-* do validar.py.
# De onde vem: o desenho das etapas é o do plano (docs/plano/PLANO-HELENA-V3.md, "Os 5 primeiros
#   agentes e a primeira meta"). Objetivos, decisões e entradas externas vieram do roteiro antigo, guardado em
#   docs/arquivo/helena-v2-v1/recrutar-10-pessoas-v1.yaml. Os JOB-HR-... são números de entregas já
#   aprovadas na v1: identificam arquivos, não são senha nem chave.
# Como mudar: edite aqui e rode `python validar.py` (na pasta helena-v2); ele recusa o que estiver errado.
#
# O que NÃO se escreve aqui, porque já está em outro lugar (mexa lá, não aqui):
#   - quem faz, quem revisa (e a reserva), internet, ferramentas e ações do agente: servicos.yaml;
#   - empresa, prioridade e prazo do card: são seus, na caixa "Novo pedido" do app;
#   - o texto vigente das decisões: o código lê na hora (decisoes abaixo só diz quais valem).
#
# Orçamento (orcamento_meta): é o teto da meta inteira, não o gasto esperado. A conta foi feita
#   com as fichas dos agentes (agents/*.yaml): uma passada limpa das 5 etapas pede 62 chamadas e 11
#   execuções; cada volta de ajuste do parecer (E2, E3 e E4 de novo) soma 50 chamadas e 6 execuções;
#   passada limpa mais 2 voltas dá 162 chamadas e 23 execuções, e a folga é de cerca de 25%.
#   O parecer lê até 30 partes de página por passada: 3 passadas = 90. Se uma ficha mudar,
#   o validar.py avisa (ROTEIRO-ORCAMENTO) e é aqui que se ajusta.

id: recrutar-10-pessoas
versao: "3.1.0"
nome: Recrutar as primeiras 10 pessoas na Mimix e no Hub
empresas: [BIZ-003]
prazo_sugerido_dias: 7        # só sugestão para o "Entendi assim"; o prazo do card é seu
decisoes: [DEC-024, DEC-025]  # o código injeta o texto vigente e grava a versão em cada despacho

entradas_externas:            # entregas aprovadas da v1, copiadas (com data) antes da execução
  pesquisa_mimix_hub: JOB-HR-a5dabb24ffdbdaa016299f0e5e3def89
  pesquisa_indicacao_equipe: JOB-HR-0ed988ddf445b819ca5833dfa79831e9
  condicoes_participante: JOB-HR-f6d55eff0523a50f07397cffbfbe313d

orcamento_meta:
  chamadas_total: 200
  buscas: 0                   # a ferramenta "buscar" só existe na fase 4
  partes_de_pagina: 90
  execucoes: 30

etapas:
  - id: E1
    servico: SRV-CALCULO      # conta e cenários (Caio)
    objetivo: >-
      Conta da receita com 10 pessoas (horas por semana x US$ 0,50 por hora aprovada, paga pela
      plataforma), em três cenários, e quanto cada participante recebe.
    entradas: [pesquisa_indicacao_equipe, condicoes_participante]
    depende_de: []

  - id: E2
    servico: SRV-ROTEIRO-TREINAMENTO   # roteiro para a pessoa leiga (Isabela)
    objetivo: >-
      Como gravar atividades do dia a dia com qualidade e privacidade, para a pessoa não ser reprovada.
    entradas: [pesquisa_mimix_hub, condicoes_participante]
    depende_de: []

  - id: E3
    servico: SRV-COPY         # convite (Isabela)
    objetivo: >-
      Convite para as primeiras 10 pessoas (WhatsApp e redes), sem nenhuma promessa de renda.
    # Sem E1 de propósito: o convite nem recebe a conta (MAT-16). Não ligar E3 a E1.
    entradas: [condicoes_participante]
    depende_de: []

  - id: E4
    servico: SRV-PARECER      # checagem jurídica (Clara)
    objetivo: >-
      O convite (E3) e o roteiro (E2) podem ser usados? Riscos de imagem, voz, terceiros e LGPD,
      com o ajuste concreto por peça e a conclusão sobre o cadastro na Mimix e no Hub (PF-01).
    entradas: [E2, E3, condicoes_participante]
    depende_de: [E2, E3]
    julga: [E2, E3]
    se_semaforo:
      AJUSTE:                 # a Isabela refaz E2 e E3 e a Clara confere de novo
        refazer: [E2, E3]
        max_ciclos: 2         # o schema e a máquina fixam em 2; depois da 2ª volta vai para você
      NAO_PODE:
        aguardar_fundador: true

  - id: E5
    servico: SRV-RELATORIO-FINAL   # relatório para você (Helena); última etapa, depende de todas
    objetivo: >-
      Plano dos 7 dias para o Fundador, em linguagem simples: o que cada etapa aprovou, o que só ele
      faz (cadastro na Mimix e no Hub, envio do roteiro e do convite) e como acompanhar as
      primeiras horas aprovadas.
    entradas: [E1, E2, E3, E4]
    depende_de: [E1, E2, E3, E4]

# O que só você faz. O motor nunca executa nada disto: vira lista no relatório e só nasce depois
# do parecer aprovado por você. Uma ação por etapa, e o id tem de estar entre os do serviço dela.
acoes_do_fundador:
  - etapa: E2
    acao_do_fundador: AF-TREINAMENTO-ENVIAR
    descricao: Enviar o roteiro de treinamento aprovado às pessoas que aceitarem o convite.
  - etapa: E3
    acao_do_fundador: AF-COPY-ENVIAR-OU-PUBLICAR
    descricao: Enviar o convite aprovado às 10 primeiras pessoas, por WhatsApp e redes.

# Passos de fora que não são entrega de nenhum agente. A Clara tem de responder OK ou NÃO PODE
# para cada um dentro do parecer que os cobre.
passos_fixos_do_fundador:
  - id: PF-01
    texto: Cadastrar a Humano Digital na Mimix e no Hub e configurar a indicação.
    categorias: [CADASTRO]
    coberto_pelo_parecer: E4
